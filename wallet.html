<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Wallet</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#000 !important;
}

body{
    color:#fff;
    font-family:'Chakra Petch', Arial, sans-serif;
    overflow-x:hidden;
    padding:0 !important;
}


/* =====================================================
   WALLET PAGE
===================================================== */

#walletPage{
    width:100%;
    min-height:100vh;

    background:#000;

    color:#fff;

    padding:
        24px
        16px
        115px;

    overflow:hidden;
}

.wallet-wrap{
    width:100%;
    max-width:700px;
    margin:0 auto;
}


/* =====================================================
   WALLET TITLE
===================================================== */

.wallet-title{
    text-align:left;

    font-size:27px;
    font-weight:700;

    letter-spacing:.5px;

    margin:
        5px 0
        24px 4px;

    color:#fff;

    text-shadow:
        0 0 4px rgba(255,255,255,.35);
}


/* =====================================================
   BALANCE CARD
===================================================== */

.wallet-balance{

    position:relative;

    width:100%;

    background:
        linear-gradient(
            145deg,
            #111 0%,
            #070707 50%,
            #030303 100%
        );

    border:1px solid rgba(255,255,255,.72);

    border-radius:24px;

    padding:23px 20px 20px;

    overflow:hidden;

    box-shadow:
        0 0 7px rgba(255,255,255,.16),
        inset 0 0 18px rgba(255,255,255,.025);
}


/* Decorative circle */

.wallet-balance::before{

    content:"";

    position:absolute;

    top:-80px;
    right:-80px;

    width:180px;
    height:180px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.16);
}


/* =====================================================
   BALANCE TEXT
===================================================== */

.balance-label{

    color:#999;

    font-size:12px;

    letter-spacing:2px;

    text-transform:uppercase;

    margin-bottom:8px;
}

.balance-amount{

    font-size:40px;

    font-weight:700;

    letter-spacing:1px;

    color:#fff;

    text-shadow:
        0 0 5px rgba(255,255,255,.45);
}


/* =====================================================
   LINE
===================================================== */

.balance-line{

    width:100%;

    height:1px;

    background:rgba(255,255,255,.28);

    margin:18px 0;
}


/* =====================================================
   MONEY ROW
===================================================== */

.money-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:13px 0;
}

.money-name{

    color:#999;

    font-size:14px;
}

.money-value{

    color:#fff;

    font-size:16px;

    font-weight:600;
}


/* =====================================================
   WALLET BUTTONS
===================================================== */

.wallet-actions{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

    margin-top:20px;
}

.wallet-btn{

    height:48px;

    border-radius:14px;

    border:1px solid rgba(255,255,255,.78);

    background:#050505;

    color:#fff;

    font-family:inherit;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:
        .2s ease;

    box-shadow:
        0 0 5px rgba(255,255,255,.12);
}

.wallet-btn:active{

    transform:scale(.97);

    background:#111;

    box-shadow:
        0 0 10px rgba(255,255,255,.25);
}


/* =====================================================
   STATS
===================================================== */

.wallet-stats{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:13px;

    margin-top:18px;
}

.wallet-stat{

    min-height:105px;

    background:#060606;

    border:1px solid rgba(255,255,255,.55);

    border-radius:19px;

    padding:18px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    box-shadow:
        0 0 6px rgba(255,255,255,.10);
}

.stat-label{

    color:#999;

    font-size:12px;

    letter-spacing:1.5px;

    margin-bottom:9px;
}

.stat-value{

    color:#fff;

    font-size:22px;

    font-weight:700;

    text-shadow:
        0 0 4px rgba(255,255,255,.35);
}


/* =====================================================
   HISTORY TITLE
===================================================== */

.history-title{

    text-align:center;

    margin:
        30px 0
        16px;

    font-size:21px;

    font-weight:700;

    color:#fff;

    text-shadow:
        0 0 5px rgba(255,255,255,.35);
}

.history-title::after{

    content:"";

    display:block;

    width:50px;

    height:2px;

    margin:
        9px auto
        0;

    background:#fff;

    box-shadow:
        0 0 5px rgba(255,255,255,.35);
}


/* =====================================================
   HISTORY BOX
===================================================== */

.wallet-history{

    width:100%;

    min-height:115px;

    background:#050505;

    border:1px solid rgba(255,255,255,.48);

    border-radius:19px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:20px;

    color:#777;

    font-size:13px;

    box-shadow:
        0 0 6px rgba(255,255,255,.08);
}


/* =====================================================
   PREMIUM BOTTOM NAVIGATION
===================================================== */

.bottom-nav{

    position:fixed;

    left:18px;
    right:18px;
    bottom:16px;

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    background:
        rgba(12,12,14,.96);

    border:1px solid rgba(255,255,255,.16);

    border-radius:24px;

    box-shadow:
        0 8px 28px rgba(0,0,0,.9);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    z-index:99999;
}


/* NAV BUTTON */

.bottom-nav .nav-item{

    position:relative;

    width:70px;
    height:58px;

    border:0 !important;

    outline:none;

    background:transparent !important;

    color:#666;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;

    cursor:pointer;

    transition:
        .2s ease;
}


/* ICON */

.bottom-nav .nav-icon{

    font-size:27px;

    color:#666;

    transition:
        .2s ease;
}


/* =====================================================
   ACTIVE WALLET
===================================================== */

.bottom-nav
.nav-item.active
.nav-icon{

    color:#fff;

    text-shadow:
        0 0 4px rgba(255,255,255,.6),
        0 0 10px rgba(255,255,255,.25);

    transform:scale(1.06);
}


/* ACTIVE DOT */

.bottom-nav
.nav-item.active::after{

    content:"";

    position:absolute;

    bottom:2px;

    left:50%;

    width:5px;
    height:5px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 5px rgba(255,255,255,.55);
}


/* TOUCH */

.bottom-nav
.nav-item:active{

    transform:scale(.90);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    #walletPage{

        padding:
            20px
            15px
            110px;
    }

    .wallet-title{

        font-size:25px;

        margin-bottom:22px;
    }

    .wallet-balance{

        padding:
            21px
            17px
            19px;

        border-radius:23px;
    }

    .balance-amount{

        font-size:38px;
    }

    .wallet-btn{

        height:46px;

        font-size:13px;
    }

    .wallet-stat{

        min-height:95px;

        padding:17px;
    }

    .stat-value{

        font-size:20px;
    }

    .bottom-nav{

        left:14px;
        right:14px;

        bottom:14px;

        height:68px;

        border-radius:23px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     WALLET PAGE
===================================================== -->

<section id="walletPage">

<div class="wallet-wrap">


    <!-- TITLE -->

    <div class="wallet-title">
        My Wallet
    </div>


    <!-- =================================================
         BALANCE
    ================================================== -->

    <div class="wallet-balance">

        <div class="balance-label">
            Total Balance
        </div>

        <div class="balance-amount">
            ₹0.00
        </div>


        <div class="balance-line"></div>


        <div class="money-row">

            <div class="money-name">
                Win Money
            </div>

            <div class="money-value">
                ₹0.00
            </div>

        </div>


        <div class="money-row">

            <div class="money-name">
                Join Money
            </div>

            <div class="money-value">
                ₹0.00
            </div>

        </div>


        <!-- BUTTONS -->

        <div class="wallet-actions">

            <button
                class="wallet-btn"
                onclick="addMoney()">

                ADD MONEY

            </button>


            <button
                class="wallet-btn"
                onclick="withdrawMoney()">

                WITHDRAW

            </button>

        </div>

    </div>


    <!-- =================================================
         STATS
    ================================================== -->

    <div class="wallet-stats">


        <div class="wallet-stat">

            <div class="stat-label">
                EARNINGS
            </div>

            <div class="stat-value">
                ₹0.00
            </div>

        </div>


        <div class="wallet-stat">

            <div class="stat-label">
                PAYOUTS
            </div>

            <div class="stat-value">
                ₹0.00
            </div>

        </div>


    </div>


    <!-- =================================================
         HISTORY
    ================================================== -->

    <div class="history-title">
        WALLET HISTORY
    </div>


    <div class="wallet-history">

        No wallet transactions yet.

    </div>


</div>


<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">


    <!-- HOME -->

    <button
        class="nav-item"
        data-page="home"
        onclick="goHome()">

        <span class="nav-icon">
            ⌂
        </span>

    </button>


    <!-- WALLET -->

    <button
        class="nav-item active"
        data-page="wallet"
        onclick="goWallet()">

        <span class="nav-icon">
            ▣
        </span>

    </button>


    <!-- PROFILE -->

    <button
        class="nav-item"
        data-page="profile"
        onclick="goProfile()">

        <span class="nav-icon">
            ♟
        </span>

    </button>


</nav>

</section>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

function addMoney(){

    alert("Add Money");

}


function withdrawMoney(){

    alert("Withdraw");

}


function goHome(){

    window.location.href =
        "index.html";

}


function goWallet(){

    window.location.href =
        "wallet.html";

}


function goProfile(){

    window.location.href =
        "profile.html";

}

</script>


</body>
</html>
