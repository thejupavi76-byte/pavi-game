<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Wallet</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    background:#000 !important;
    color:#fff !important;
    font-family:'Chakra Petch',Arial,sans-serif;
}

.wallet-wrap{
    min-height:100vh;
    background:#000 !important;
    color:#fff !important;
    padding:20px 15px 100px;
}

/* WALLET HEADER */
.wallet-top{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.wallet-back{
    width:38px;
    height:38px;
    border:1px solid #fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:26px;
    cursor:pointer;
    box-shadow:0 0 10px rgba(255,255,255,.25);
}

.wallet-title{
    color:#fff;
    font-size:25px;
    font-weight:700;
}

/* BALANCE CARD */
.wallet-balance{
    width:100%;
    padding:22px 18px;
    border:1px solid #fff;
    border-radius:23px;
    background:
        radial-gradient(circle at top right,
        rgba(255,255,255,.10),
        transparent 45%),
        #050505;
    box-shadow:
        0 0 15px rgba(255,255,255,.30),
        inset 0 0 20px rgba(255,255,255,.02);
}

.balance-label{
    color:#aaa;
    font-size:12px;
    letter-spacing:2px;
    margin-bottom:8px;
}

.balance-amount{
    color:#fff;
    font-size:38px;
    font-weight:700;
    margin-bottom:15px;
}

.balance-line{
    width:100%;
    height:1px;
    background:#333;
    margin-bottom:12px;
}

.money-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 0;
}

.money-name{
    color:#aaa;
    font-size:13px;
}

.money-value{
    color:#fff;
    font-size:14px;
}

/* BUTTONS */
.wallet-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.wallet-btn{
    flex:1;
    height:46px;
    border:1px solid #fff;
    border-radius:16px;
    background:#000 !important;
    color:#fff !important;
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 0 8px rgba(255,255,255,.20);
}

.wallet-btn:active{
    transform:scale(.97);
    background:#fff !important;
    color:#000 !important;
}

/* STATS */
.wallet-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:15px;
}

.wallet-stat{
    min-height:95px;
    padding:18px 15px;
    border:1px solid #fff;
    border-radius:18px;
    background:#050505;
    box-shadow:
        0 0 10px rgba(255,255,255,.25),
        inset 0 0 15px rgba(255,255,255,.02);
}

.stat-label{
    color:#aaa;
    font-size:11px;
    letter-spacing:1px;
    margin-bottom:10px;
}

.stat-value{
    color:#fff;
    font-size:20px;
    font-weight:700;
}

/* HISTORY */
.history-title{
    text-align:center;
    color:#fff;
    font-size:16px;
    font-weight:700;
    letter-spacing:1px;
    margin:28px 0 12px;
    text-shadow:0 0 10px #fff;
}

.wallet-history{
    min-height:75px;
    width:100%;
    border:1px solid #fff;
    border-radius:18px;
    background:#050505;
    color:#777;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:12px;
    padding:15px;
    box-shadow:0 0 10px rgba(255,255,255,.20);
}

/* MOBILE */
@media(max-width:500px){

    .wallet-wrap{
        padding:20px 10px 100px;
    }

    .wallet-title{
        font-size:25px;
    }

    .wallet-balance{
        padding:21px 17px;
        border-radius:23px;
    }

    .balance-amount{
        font-size:38px;
    }

    .wallet-btn{
        height:46px;
    }

    .wallet-stat{
        min-height:95px;
    }

    .stat-value{
        font-size:20px;
    }
}

</style>
</head>

<body>

<!-- INGA THAAN WALLET HTML START AAGANUM -->

<div class="wallet-wrap">

    <div class="wallet-top">
        <div class="wallet-back" onclick="showHome()">‹</div>

        <div class="wallet-title">
            My Wallet
        </div>
    </div>

    <div class="wallet-balance">

        <div class="balance-label">
            TOTAL BALANCE
        </div>

        <div class="balance-amount">
            ₹0.00
        </div>

        <div class="balance-line"></div>

        <div class="money-row">
            <div class="money-name">Win Money</div>
            <div class="money-value">₹0.00</div>
        </div>

        <div class="money-row">
            <div class="money-name">Join Money</div>
            <div class="money-value">₹0.00</div>
        </div>

        <div class="wallet-actions">
            <button class="wallet-btn" onclick="addMoney()">ADD MONEY</button>
            <button class="wallet-btn" onclick="withdrawMoney()">WITHDRAW</button>
        </div>

    </div>

    <div class="wallet-stats">

        <div class="wallet-stat">
            <div class="stat-label">EARNINGS</div>
            <div class="stat-value">₹0.00</div>
        </div>

        <div class="wallet-stat">
            <div class="stat-label">PAYOUTS</div>
            <div class="stat-value">₹0.00</div>
        </div>

    </div>

    <div class="history-title">
        WALLET HISTORY
    </div>

    <div class="wallet-history">
        No wallet transactions yet.
    </div>

</div>

<script>

function addMoney(){
    alert("Add Money");
}

function withdrawMoney(){
    alert("Withdraw");
}

function showHome(){
    window.location.href="index.html";
}

</script>

</body>
</html>
