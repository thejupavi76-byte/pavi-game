<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Wallet</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#090014;
    color:#fff;
    font-family:Arial,sans-serif;
}

.wallet-page{
    min-height:100vh;
    padding:20px 15px 50px;
}

/* HEADER */

.wallet-header{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:35px;
}

.back-btn{
    color:#fff;
    text-decoration:none;
    font-size:42px;
    line-height:1;
}

.wallet-header h1{
    margin:0;
    font-size:34px;
    font-weight:700;
}

/* BALANCE TITLE */

.balance-title{
    text-align:center;
    font-size:30px;
    font-weight:700;
    margin-bottom:18px;
}

/* BALANCE CARD */

.balance-card{
    background:linear-gradient(
        135deg,
        #210044,
        #31005e
    );

    border-radius:12px;
    padding:25px;
    margin-bottom:25px;

    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:25px;

    box-shadow:0 0 20px rgba(128,0,255,.15);
}

.balance-left{
    flex:1;
}

.total-amount{
    font-size:38px;
    font-weight:700;
    margin-bottom:15px;
}

.money-row{
    font-size:22px;
    margin:8px 0;
}

.coin{
    color:#ffd21c;
}

/* BUTTONS */

.action-buttons{
    display:flex;
    flex-direction:column;
    gap:15px;
    width:230px;
}

.action-btn{
    border:0;
    border-radius:12px;
    padding:15px;
    font-size:25px;
    font-weight:700;
    color:#fff;

    background:linear-gradient(
        135deg,
        #5b00ff,
        #8000ff
    );

    cursor:pointer;
    transition:.2s;
}

.action-btn:hover{
    opacity:.9;
}

.action-btn:active{
    transform:scale(.97);
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:25px;
}

.stat-title{
    text-align:center;
    font-size:27px;
    font-weight:700;
    margin-bottom:10px;
}

.stat-card{
    background:#210044;
    padding:18px;
    border-radius:8px;
    text-align:center;
    font-size:25px;
}

/* HISTORY */

.history-title{
    text-align:center;
    font-size:30px;
    font-weight:700;
    margin:20px 0;
}

.history-card{
    background:#210044;
    border-radius:12px;
    padding:18px;
    margin-bottom:15px;

    display:flex;
    align-items:center;
    gap:15px;
}

.history-type{
    width:95px;
    flex-shrink:0;
    font-size:19px;
    font-weight:700;
}

.credit{
    color:#25e86d;
}

.debit{
    color:#ff4141;
}

.history-details{
    flex:1;
    min-width:0;
}

.history-name{
    color:#ff9638;
    font-size:20px;
    font-weight:600;
}

.history-date{
    font-size:16px;
    margin-top:8px;
    color:#eee;
}

.history-amount{
    flex-shrink:0;
    font-size:22px;
    font-weight:700;
    text-align:right;
}

.pending{
    color:#ffd21c;
    font-size:14px;
}

.success{
    color:#25e86d;
    font-size:14px;
}

.no-history{
    background:#210044;
    padding:25px;
    text-align:center;
    border-radius:12px;
    color:#aaa;
}

/* MODAL */

.modal-content{
    background:#050505 !important;
    color:#fff !important;
    border:1px solid rgba(255,255,255,.7);
    border-radius:14px;
}

.modal-header,
.modal-footer{
    border-color:rgba(255,255,255,.2);
}

.modal-title,
.modal-body,
.form-label{
    color:#fff !important;
}

.form-control{
    background:#000 !important;
    color:#fff !important;
    border:1px solid rgba(255,255,255,.55) !important;
    border-radius:9px !important;
}

.form-control::placeholder{
    color:#777 !important;
}

.form-control:focus{
    background:#000 !important;
    color:#fff !important;
    border-color:#fff !important;

    box-shadow:
        0 0 5px rgba(255,255,255,.7) !important;
}

.btn-close{
    filter:invert(1);
}

.btn-primary{
    background:#050505 !important;
    border:1px solid #fff !important;
    color:#fff !important;
}

.btn-danger{
    background:#050505 !important;
    border:1px solid #ff4141 !important;
    color:#fff !important;
}

.alert-info,
.alert-success,
.alert-warning{
    background:#111 !important;
    color:#fff !important;
    border:1px solid #777 !important;
}

/* MOBILE */

@media(max-width:600px){

    .wallet-page{
        padding:18px 12px 45px;
    }

    .wallet-header{
        gap:12px;
        margin-bottom:35px;
    }

    .back-btn{
        font-size:40px;
    }

    .wallet-header h1{
        font-size:28px;
    }

    .balance-title{
        font-size:25px;
    }

    .balance-card{
        padding:18px;
        flex-direction:column;
        align-items:stretch;
        gap:20px;
    }

    .total-amount{
        font-size:34px;
    }

    .money-row{
        font-size:19px;
    }

    .action-buttons{
        width:100%;
        flex-direction:row;
        gap:10px;
    }

    .action-btn{
        flex:1;
        font-size:20px;
        padding:13px 8px;
    }

    .stats{
        gap:10px;
    }

    .stat-title{
        font-size:21px;
    }

    .stat-card{
        font-size:20px;
        padding:15px 5px;
    }

    .history-title{
        font-size:27px;
    }

    .history-card{
        padding:14px 10px;
        gap:8px;
    }

    .history-type{
        width:60px;
        font-size:13px;
    }

    .history-name{
        font-size:15px;
    }

    .history-date{
        font-size:11px;
    }

    .history-amount{
        font-size:15px;
    }

    .pending,
    .success{
        font-size:11px;
    }
}

@media(max-width:380px){

    .wallet-page{
        padding-left:9px;
        padding-right:9px;
    }

    .total-amount{
        font-size:30px;
    }

    .money-row{
        font-size:17px;
    }

    .action-btn{
        font-size:18px;
    }

    .history-type{
        width:55px;
        font-size:12px;
    }

    .history-name{
        font-size:14px;
    }

    .history-amount{
        font-size:14px;
    }
}

</style>
</head>

<body>

<div class="wallet-page">

<!-- HEADER -->

<div class="wallet-header">

    <a href="index.html" class="back-btn">
        ‹
    </a>

    <h1>
        My Wallet
    </h1>

</div>


<!-- BALANCE TITLE -->

<div class="balance-title">
    TOTAL BALANCE
</div>


<!-- BALANCE CARD -->

<div class="balance-card">

    <div class="balance-left">

        <div class="total-amount">
            🪙 ₹<span id="balance">0.00</span>
        </div>

        <div class="money-row">
            Win money :
            <span class="coin">🪙</span>
            ₹<span id="winMoney">0.00</span>
        </div>

        <div class="money-row">
            Join money :
            <span class="coin">🪙</span>
            ₹<span id="joinMoney">0.00</span>
        </div>

    </div>


    <div class="action-buttons">

        <button
            type="button"
            class="action-btn"
            data-bs-toggle="modal"
            data-bs-target="#depositModal">

            ADD

        </button>


        <button
            type="button"
            class="action-btn"
            data-bs-toggle="modal"
            data-bs-target="#withdrawModal">

            WITHDRAW

        </button>

    </div>

</div>


<!-- STATS -->

<div class="stats">

    <div>

        <div class="stat-title">
            Earnings
        </div>

        <div class="stat-card">
            🪙 ₹<span id="totalDeposits">0.00</span>
        </div>

    </div>


    <div>

        <div class="stat-title">
            PAYOUTS
        </div>

        <div class="stat-card">
            🪙 ₹<span id="totalWithdrawals">0.00</span>
        </div>

    </div>

</div>


<!-- HISTORY -->

<div class="history-title">
    WALLET HISTORY
</div>


<div id="historyContainer">

    <div class="no-history">
        No wallet transactions yet.
    </div>

</div>


</div>


<!-- =========================
     DEPOSIT MODAL
========================= -->

<div
    class="modal fade"
    id="depositModal"
    tabindex="-1"
    aria-hidden="true"
>

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Add Money
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal"
aria-label="Close"
></button>

</div>


<form id="depositForm">

<div class="modal-body">


<div class="alert alert-info">

UPI ID:
<strong>
YOUR-UPI-ID@upi
</strong>

</div>


<label class="form-label">
Amount
</label>

<input
type="number"
id="depositAmount"
step="0.01"
min="1"
class="form-control mb-3"
placeholder="Enter amount"
required
>


<label class="form-label">
UPI Transaction ID
</label>

<input
type="text"
id="transactionId"
class="form-control"
placeholder="Enter transaction ID"
required
>

</div>


<div class="modal-footer">

<button
type="submit"
class="btn btn-primary w-100"
>

Submit Deposit Request

</button>

</div>

</form>

</div>

</div>

</div>


<!-- =========================
     WITHDRAW MODAL
========================= -->

<div
class="modal fade"
id="withdrawModal"
tabindex="-1"
aria-hidden="true"
>

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Withdraw Money
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal"
aria-label="Close"
></button>

</div>


<form id="withdrawForm">

<div class="modal-body">


<div class="alert alert-success">

Your UPI ID:
<strong>
YOUR-UPI-ID@upi
</strong>

</div>


<label class="form-label">
Amount to Withdraw
</label>

<input
type="number"
id="withdrawAmount"
step="0.01"
min="1"
class="form-control"
placeholder="Enter amount"
required
>

</div>


<div class="modal-footer">

<button
type="submit"
class="btn btn-danger w-100"
>

Request Withdrawal

</button>

</div>

</form>

</div>

</div>

</div>


<!-- BOOTSTRAP -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

/* =========================
   WALLET DATA
========================= */

let balance =
    parseFloat(localStorage.getItem("walletBalance")) || 0;

let totalDeposits =
    parseFloat(localStorage.getItem("walletDeposits")) || 0;

let totalWithdrawals =
    parseFloat(localStorage.getItem("walletWithdrawals")) || 0;

let history =
    JSON.parse(localStorage.getItem("walletHistory")) || [];


/* =========================
   SAVE DATA
========================= */

function saveWallet(){

    localStorage.setItem(
        "walletBalance",
        balance
    );

    localStorage.setItem(
        "walletDeposits",
        totalDeposits
    );

    localStorage.setItem(
        "walletWithdrawals",
        totalWithdrawals
    );

    localStorage.setItem(
        "walletHistory",
        JSON.stringify(history)
    );
}


/* =========================
   UPDATE UI
========================= */

function updateWallet(){

    document.getElementById("balance")
        .textContent = balance.toFixed(2);

    document.getElementById("joinMoney")
        .textContent = balance.toFixed(2);

    document.getElementById("totalDeposits")
        .textContent = totalDeposits.toFixed(2);

    document.getElementById("totalWithdrawals")
        .textContent = totalWithdrawals.toFixed(2);

    renderHistory();
}


/* =========================
   HISTORY
========================= */

function renderHistory(){

    const container =
        document.getElementById("historyContainer");

    if(history.length === 0){

        container.innerHTML = `
            <div class="no-history">
                No wallet transactions yet.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    history.forEach(item => {

        const card =
            document.createElement("div");

        card.className =
            "history-card";


        const typeClass =
            item.type === "CREDIT"
            ? "credit"
            : "debit";


        const sign =
            item.type === "CREDIT"
            ? "+"
            : "-";


        card.innerHTML = `

            <div class="history-type ${typeClass}">
                ${item.type}
            </div>

            <div class="history-details">

                <div class="history-name">
                    ${item.title}
                </div>

                <div class="history-date">
                    ${item.date}
                </div>

                <div>
                    <span class="pending">
                        ${item.status}
                    </span>
                </div>

            </div>

            <div class="history-amount">

                <span class="${typeClass}">
                    ${sign} 🪙 ₹${item.amount.toFixed(2)}
                </span>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =========================
   DEPOSIT
========================= */

document
.getElementById("depositForm")
.addEventListener("submit", function(e){

    e.preventDefault();


    const amount =
        parseFloat(
            document.getElementById(
                "depositAmount"
            ).value
        );


    const transactionId =
        document.getElementById(
            "transactionId"
        ).value.trim();


    if(amount <= 0){

        alert(
            "Please enter a valid amount."
        );

        return;
    }


    if(transactionId === ""){

        alert(
            "Please enter UPI transaction ID."
        );

        return;
    }


    /*
       Demo HTML wallet:
       Deposit is added immediately.
    */

    balance += amount;

    totalDeposits += amount;


    history.unshift({

        type:"CREDIT",

        title:"Added By UPI",

        amount:amount,

        status:"Pending",

        date:new Date()
            .toLocaleString()

    });


    saveWallet();

    updateWallet();


    document
        .getElementById("depositForm")
        .reset();


    const modal =
        bootstrap.Modal
        .getInstance(
            document.getElementById(
                "depositModal"
            )
        );


    modal.hide();


    alert(
        "Deposit request submitted successfully."
    );

});


/* =========================
   WITHDRAW
========================= */

document
.getElementById("withdrawForm")
.addEventListener("submit", function(e){

    e.preventDefault();


    const amount =
        parseFloat(
            document.getElementById(
                "withdrawAmount"
            ).value
        );


    if(amount <= 0){

        alert(
            "Please enter a valid withdrawal amount."
        );

        return;
    }


    if(amount > balance){

        alert(
            "Insufficient wallet balance."
        );

        return;
    }


    balance -= amount;

    totalWithdrawals += amount;


    history.unshift({

        type:"DEBIT",

        title:"Withdrawal",

        amount:amount,

        status:"Pending",

        date:new Date()
            .toLocaleString()

    });


    saveWallet();

    updateWallet();


    document
        .getElementById("withdrawForm")
        .reset();


    const modal =
        bootstrap.Modal
        .getInstance(
            document.getElementById(
                "withdrawModal"
            )
        );


    modal.hide();


    alert(
        "Withdrawal request submitted."
    );

});


/* =========================
   LOAD
========================= */

updateWallet();

</script>

</body>
</html>
