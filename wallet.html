<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Wallet</title>

<style>

/* INGA CSS MATTUM */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    background:#000;
    color:#fff;
    font-family:'Chakra Petch',Arial,sans-serif;
}

.wallet-wrap{
    min-height:100vh;
    background:#000;
    padding:20px 15px 100px;
}

/* remaining wallet CSS inga */

</style>
</head>

<body>

<!-- INGA THAAN WALLET HTML START AAGANUM -->

<div class="wallet-wrap">

    <div class="wallet-top">
        <div class="wallet-back" onclick="showHome()">‹</div>

        <div class="wallet-title">
            My Wallet
        </div>
    </div>

    <div class="wallet-balance">

        <div class="balance-label">
            TOTAL BALANCE
        </div>

        <div class="balance-amount">
            ₹0.00
        </div>

        <div class="balance-line"></div>

        <div class="money-row">
            <div class="money-name">Win Money</div>
            <div class="money-value">₹0.00</div>
        </div>

        <div class="money-row">
            <div class="money-name">Join Money</div>
            <div class="money-value">₹0.00</div>
        </div>

        <div class="wallet-actions">
            <button class="wallet-btn" onclick="addMoney()">ADD MONEY</button>
            <button class="wallet-btn" onclick="withdrawMoney()">WITHDRAW</button>
        </div>

    </div>

    <div class="wallet-stats">

        <div class="wallet-stat">
            <div class="stat-label">EARNINGS</div>
            <div class="stat-value">₹0.00</div>
        </div>

        <div class="wallet-stat">
            <div class="stat-label">PAYOUTS</div>
            <div class="stat-value">₹0.00</div>
        </div>

    </div>

    <div class="history-title">
        WALLET HISTORY
    </div>

    <div class="wallet-history">
        No wallet transactions yet.
    </div>

</div>

<script>

function addMoney(){
    alert("Add Money");
}

function withdrawMoney(){
    alert("Withdraw");
}

function showHome(){
    window.location.href="index.html";
}

</script>

</body>
</html>
