<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Wallet</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    background:#000 !important;
    color:#fff !important;
    font-family:'Chakra Petch',Arial,sans-serif;
}

/* ==============================
   WALLET PAGE — PREMIUM B&W
   ============================== */

#walletPage,
.wallet-page,
.wallet-wrap{
    background:#000 !important;
    color:#fff !important;
}

/* Main wallet container */
.wallet-wrap{
    min-height:100vh;
    padding:20px 15px 100px;
}

/* ==============================
   HEADER
   ============================== */

.wallet-top{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:28px;
}

.wallet-back{
    color:#fff !important;
    font-size:38px;
    line-height:1;
    text-decoration:none;
    cursor:pointer;
    text-shadow:
        0 0 6px #fff,
        0 0 14px rgba(255,255,255,.45);
}

.wallet-title{
    color:#fff !important;
    font-size:26px;
    font-weight:800;
    letter-spacing:.5px;
    text-shadow:
        0 0 6px #fff,
        0 0 16px rgba(255,255,255,.45);
}

/* ==============================
   TOTAL BALANCE CARD
   ============================== */

.wallet-balance{
    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(255,255,255,.10),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #050505,
            #101010 55%,
            #000
        ) !important;

    border:1px solid rgba(255,255,255,.85) !important;
    border-radius:24px;

    padding:24px 20px;

    box-shadow:
        0 0 8px rgba(255,255,255,.55),
        0 0 22px rgba(255,255,255,.18),
        inset 0 0 18px rgba(255,255,255,.035);

    color:#fff !important;
}

/* subtle glowing corner */
.wallet-balance::after{
    content:"";
    position:absolute;
    width:130px;
    height:130px;
    right:-65px;
    top:-65px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.35);

    box-shadow:
        0 0 15px rgba(255,255,255,.15),
        inset 0 0 15px rgba(255,255,255,.08);

    pointer-events:none;
}

.balance-label{
    color:#aaa !important;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-bottom:8px;
}

.balance-amount{
    color:#fff !important;
    font-size:38px;
    font-weight:900;
    letter-spacing:1px;

    text-shadow:
        0 0 7px #fff,
        0 0 18px rgba(255,255,255,.35);
}

.balance-line{
    height:1px;
    width:100%;
    margin:18px 0;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.75),
        transparent
    );

    box-shadow:0 0 7px rgba(255,255,255,.35);
}

/* ==============================
   MONEY ROW
   ============================== */

.money-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin:15px 0;

    color:#fff !important;
}

.money-name{
    color:#aaa !important;
    font-size:13px;
}

.money-value{
    color:#fff !important;
    font-size:15px;
    font-weight:700;

    text-shadow:0 0 7px rgba(255,255,255,.35);
}

/* ==============================
   BUTTONS
   ============================== */

.wallet-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.wallet-btn{
    height:48px;

    border-radius:16px;

    background:#000 !important;
    color:#fff !important;

    border:1px solid rgba(255,255,255,.9) !important;

    font-family:inherit;
    font-size:13px;
    font-weight:800;

    box-shadow:
        0 0 6px rgba(255,255,255,.45),
        inset 0 0 8px rgba(255,255,255,.04);

    transition:.2s ease;
}

.wallet-btn:active{
    transform:scale(.96);

    background:#fff !important;
    color:#000 !important;

    box-shadow:
        0 0 12px #fff,
        0 0 28px rgba(255,255,255,.35);
}

/* ==============================
   EARNINGS / PAYOUTS
   ============================== */

.wallet-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
}

.wallet-stat{
    min-height:95px;

    padding:18px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #090909,
            #000
        ) !important;

    border:1px solid rgba(255,255,255,.75) !important;

    box-shadow:
        0 0 7px rgba(255,255,255,.35),
        inset 0 0 12px rgba(255,255,255,.035);

    color:#fff !important;
}

.stat-label{
    color:#999 !important;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.stat-value{
    color:#fff !important;
    font-size:20px;
    font-weight:800;

    text-shadow:
        0 0 6px rgba(255,255,255,.45);
}

/* ==============================
   HISTORY
   ============================== */

.history-title{
    color:#fff !important;

    text-align:center;

    font-size:20px;
    font-weight:900;

    margin:30px 0 14px;

    letter-spacing:1px;

    text-shadow:
        0 0 6px #fff,
        0 0 15px rgba(255,255,255,.4);
}

.wallet-history{
    min-height:100px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #080808,
            #000
        ) !important;

    border:1px solid rgba(255,255,255,.65) !important;

    border-radius:18px;

    color:#777 !important;

    font-size:13px;

    box-shadow:
        0 0 7px rgba(255,255,255,.3),
        inset 0 0 12px rgba(255,255,255,.03);
}

/* ==============================
   REMOVE PURPLE / VIOLET
   ============================== */

.wallet-wrap *,
#walletPage *{
    --bs-primary:#fff !important;
    --bs-purple:#fff !important;
}

.wallet-wrap button,
#walletPage button{
    background-color:#000 !important;
    color:#fff !important;
}

/* ==============================
   MOBILE
   ============================== */

@media(max-width:500px){

    .wallet-wrap{
        padding:20px 12px 100px;
    }

    .wallet-title{
        font-size:25px;
    }

    .wallet-balance{
        padding:21px 17px;
        border-radius:23px;
    }

    .balance-amount{
        font-size:36px;
    }

    .wallet-btn{
        height:46px;
        font-size:12px;
    }

    .wallet-stat{
        min-height:95px;
        padding:16px;
    }

    .stat-value{
        font-size:20px;
    }
}

</style>
</head>

<body>

<div class="wallet-page">

<!-- HEADER -->

<div class="wallet-header">

    <a href="index.html" class="back-btn">
        ‹
    </a>

    <h1>
        My Wallet
    </h1>

</div>


<!-- BALANCE TITLE -->

<div class="balance-title">
    TOTAL BALANCE
</div>


<!-- BALANCE CARD -->

<div class="balance-card">

    <div class="balance-left">

        <div class="total-amount">
            🪙 ₹<span id="balance">0.00</span>
        </div>

        <div class="money-row">
            Win money :
            <span class="coin">🪙</span>
            ₹<span id="winMoney">0.00</span>
        </div>

        <div class="money-row">
            Join money :
            <span class="coin">🪙</span>
            ₹<span id="joinMoney">0.00</span>
        </div>

    </div>


    <div class="action-buttons">

        <button
            type="button"
            class="action-btn"
            data-bs-toggle="modal"
            data-bs-target="#depositModal">

            ADD

        </button>


        <button
            type="button"
            class="action-btn"
            data-bs-toggle="modal"
            data-bs-target="#withdrawModal">

            WITHDRAW

        </button>

    </div>

</div>


<!-- STATS -->

<div class="stats">

    <div>

        <div class="stat-title">
            Earnings
        </div>

        <div class="stat-card">
            🪙 ₹<span id="totalDeposits">0.00</span>
        </div>

    </div>


    <div>

        <div class="stat-title">
            PAYOUTS
        </div>

        <div class="stat-card">
            🪙 ₹<span id="totalWithdrawals">0.00</span>
        </div>

    </div>

</div>


<!-- HISTORY -->

<div class="history-title">
    WALLET HISTORY
</div>


<div id="historyContainer">

    <div class="no-history">
        No wallet transactions yet.
    </div>

</div>


</div>


<!-- =========================
     DEPOSIT MODAL
========================= -->

<div
    class="modal fade"
    id="depositModal"
    tabindex="-1"
    aria-hidden="true"
>

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Add Money
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal"
aria-label="Close"
></button>

</div>


<form id="depositForm">

<div class="modal-body">


<div class="alert alert-info">

UPI ID:
<strong>
YOUR-UPI-ID@upi
</strong>

</div>


<label class="form-label">
Amount
</label>

<input
type="number"
id="depositAmount"
step="0.01"
min="1"
class="form-control mb-3"
placeholder="Enter amount"
required
>


<label class="form-label">
UPI Transaction ID
</label>

<input
type="text"
id="transactionId"
class="form-control"
placeholder="Enter transaction ID"
required
>

</div>


<div class="modal-footer">

<button
type="submit"
class="btn btn-primary w-100"
>

Submit Deposit Request

</button>

</div>

</form>

</div>

</div>

</div>


<!-- =========================
     WITHDRAW MODAL
========================= -->

<div
class="modal fade"
id="withdrawModal"
tabindex="-1"
aria-hidden="true"
>

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5 class="modal-title">
Withdraw Money
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal"
aria-label="Close"
></button>

</div>


<form id="withdrawForm">

<div class="modal-body">


<div class="alert alert-success">

Your UPI ID:
<strong>
YOUR-UPI-ID@upi
</strong>

</div>


<label class="form-label">
Amount to Withdraw
</label>

<input
type="number"
id="withdrawAmount"
step="0.01"
min="1"
class="form-control"
placeholder="Enter amount"
required
>

</div>


<div class="modal-footer">

<button
type="submit"
class="btn btn-danger w-100"
>

Request Withdrawal

</button>

</div>

</form>

</div>

</div>

</div>


<!-- BOOTSTRAP -->

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

/* =========================
   WALLET DATA
========================= */

let balance =
    parseFloat(localStorage.getItem("walletBalance")) || 0;

let totalDeposits =
    parseFloat(localStorage.getItem("walletDeposits")) || 0;

let totalWithdrawals =
    parseFloat(localStorage.getItem("walletWithdrawals")) || 0;

let history =
    JSON.parse(localStorage.getItem("walletHistory")) || [];


/* =========================
   SAVE DATA
========================= */

function saveWallet(){

    localStorage.setItem(
        "walletBalance",
        balance
    );

    localStorage.setItem(
        "walletDeposits",
        totalDeposits
    );

    localStorage.setItem(
        "walletWithdrawals",
        totalWithdrawals
    );

    localStorage.setItem(
        "walletHistory",
        JSON.stringify(history)
    );
}


/* =========================
   UPDATE UI
========================= */

function updateWallet(){

    document.getElementById("balance")
        .textContent = balance.toFixed(2);

    document.getElementById("joinMoney")
        .textContent = balance.toFixed(2);

    document.getElementById("totalDeposits")
        .textContent = totalDeposits.toFixed(2);

    document.getElementById("totalWithdrawals")
        .textContent = totalWithdrawals.toFixed(2);

    renderHistory();
}


/* =========================
   HISTORY
========================= */

function renderHistory(){

    const container =
        document.getElementById("historyContainer");

    if(history.length === 0){

        container.innerHTML = `
            <div class="no-history">
                No wallet transactions yet.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    history.forEach(item => {

        const card =
            document.createElement("div");

        card.className =
            "history-card";


        const typeClass =
            item.type === "CREDIT"
            ? "credit"
            : "debit";


        const sign =
            item.type === "CREDIT"
            ? "+"
            : "-";


        card.innerHTML = `

            <div class="history-type ${typeClass}">
                ${item.type}
            </div>

            <div class="history-details">

                <div class="history-name">
                    ${item.title}
                </div>

                <div class="history-date">
                    ${item.date}
                </div>

                <div>
                    <span class="pending">
                        ${item.status}
                    </span>
                </div>

            </div>

            <div class="history-amount">

                <span class="${typeClass}">
                    ${sign} 🪙 ₹${item.amount.toFixed(2)}
                </span>

            </div>

        `;


        container.appendChild(card);

    });

}


/* =========================
   DEPOSIT
========================= */

document
.getElementById("depositForm")
.addEventListener("submit", function(e){

    e.preventDefault();


    const amount =
        parseFloat(
            document.getElementById(
                "depositAmount"
            ).value
        );


    const transactionId =
        document.getElementById(
            "transactionId"
        ).value.trim();


    if(amount <= 0){

        alert(
            "Please enter a valid amount."
        );

        return;
    }


    if(transactionId === ""){

        alert(
            "Please enter UPI transaction ID."
        );

        return;
    }


    /*
       Demo HTML wallet:
       Deposit is added immediately.
    */

    balance += amount;

    totalDeposits += amount;


    history.unshift({

        type:"CREDIT",

        title:"Added By UPI",

        amount:amount,

        status:"Pending",

        date:new Date()
            .toLocaleString()

    });


    saveWallet();

    updateWallet();


    document
        .getElementById("depositForm")
        .reset();


    const modal =
        bootstrap.Modal
        .getInstance(
            document.getElementById(
                "depositModal"
            )
        );


    modal.hide();


    alert(
        "Deposit request submitted successfully."
    );

});


/* =========================
   WITHDRAW
========================= */

document
.getElementById("withdrawForm")
.addEventListener("submit", function(e){

    e.preventDefault();


    const amount =
        parseFloat(
            document.getElementById(
                "withdrawAmount"
            ).value
        );


    if(amount <= 0){

        alert(
            "Please enter a valid withdrawal amount."
        );

        return;
    }


    if(amount > balance){

        alert(
            "Insufficient wallet balance."
        );

        return;
    }


    balance -= amount;

    totalWithdrawals += amount;


    history.unshift({

        type:"DEBIT",

        title:"Withdrawal",

        amount:amount,

        status:"Pending",

        date:new Date()
            .toLocaleString()

    });


    saveWallet();

    updateWallet();


    document
        .getElementById("withdrawForm")
        .reset();


    const modal =
        bootstrap.Modal
        .getInstance(
            document.getElementById(
                "withdrawModal"
            )
        );


    modal.hide();


    alert(
        "Withdrawal request submitted."
    );

});


/* =========================
   LOAD
========================= */

updateWallet();

</script>

</body>
</html>
