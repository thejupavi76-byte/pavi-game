<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Wallet</title>

</head>

<body>

<section id="walletPage">

<style>

/* =====================================================
   WALLET PAGE
===================================================== */

#walletPage{
    min-height:100vh;
    background:#000 !important;
    color:#fff !important;
    padding:22px 16px 115px;
    font-family:'Chakra Petch',sans-serif;
    box-sizing:border-box;
}

.wallet-wrap{
    max-width:700px;
    margin:auto;
}


/* =====================================================
   BALANCE CARD
===================================================== */

.wallet-balance{
    position:relative;
    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #111 0%,
            #050505 45%,
            #000 100%
        ) !important;

    border:1px solid #fff !important;
    border-radius:25px;

    padding:24px 20px 20px;

    box-shadow:
        0 0 7px #fff,
        0 0 20px rgba(255,255,255,.35),
        inset 0 0 25px rgba(255,255,255,.04);

    box-sizing:border-box;
}

.wallet-balance::before{
    content:"";

    position:absolute;
    top:-80px;
    right:-80px;

    width:180px;
    height:180px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
        0 0 25px rgba(255,255,255,.15);
}

.balance-label{
    color:#aaa;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:7px;
}

.balance-amount{
    font-size:42px;
    font-weight:700;
    letter-spacing:1px;

    text-shadow:
        0 0 7px #fff,
        0 0 18px rgba(255,255,255,.55);
}

.balance-line{
    height:1px;
    background:#555;
    margin:18px 0;
}

.money-row{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin:12px 0;
}

.money-name{
    color:#aaa;
    font-size:13px;
}

.money-value{
    font-size:16px;
    font-weight:600;
}


/* =====================================================
   WALLET BUTTONS
===================================================== */

.wallet-actions{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:20px;
}

.wallet-btn{
    height:48px;

    border-radius:14px;

    background:#050505 !important;
    color:#fff !important;

    border:1px solid #fff !important;

    font-family:inherit;
    font-size:14px;
    font-weight:700;

    box-shadow:
        0 0 5px rgba(255,255,255,.5),
        inset 0 0 10px rgba(255,255,255,.03);

    transition:.2s;
}

.wallet-btn:active{
    background:#fff !important;
    color:#000 !important;

    box-shadow:
        0 0 12px #fff,
        0 0 30px rgba(255,255,255,.6);
}


/* =====================================================
   STATS
===================================================== */

.wallet-stats{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:13px;

    margin-top:18px;
}

.wallet-stat{
    min-height:105px;

    background:#050505 !important;

    border:1px solid rgba(255,255,255,.8) !important;

    border-radius:19px;

    padding:18px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    box-shadow:
        0 0 6px rgba(255,255,255,.4),
        0 0 18px rgba(255,255,255,.12);

    box-sizing:border-box;
}

.stat-label{
    color:#999;

    font-size:12px;

    margin-bottom:9px;

    letter-spacing:1px;
}

.stat-value{
    font-size:22px;
    font-weight:700;

    text-shadow:
        0 0 6px #fff,
        0 0 14px rgba(255,255,255,.4);
}


/* =====================================================
   HISTORY
===================================================== */

.history-title{
    text-align:center;

    margin:30px 0 15px;

    font-size:21px;
    font-weight:700;

    text-shadow:
        0 0 6px #fff,
        0 0 15px rgba(255,255,255,.55);
}

.history-title::after{
    content:"";

    display:block;

    width:55px;
    height:2px;

    margin:9px auto 0;

    background:#fff;

    box-shadow:
        0 0 6px #fff,
        0 0 15px #fff;
}

.wallet-history{
    min-height:105px;

    background:#050505 !important;

    border:1px solid rgba(255,255,255,.7) !important;

    border-radius:19px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#888;

    font-size:13px;

    box-shadow:
        0 0 6px rgba(255,255,255,.3),
        inset 0 0 20px rgba(255,255,255,.02);
}


/* =====================================================
   PREMIUM BOTTOM NAVIGATION
===================================================== */

.bottom-nav{

    position:fixed;

    left:18px;
    right:18px;
    bottom:18px;

    height:72px;

    display:flex;

    align-items:center;
    justify-content:space-around;

    background:rgba(15,15,18,.94);

    border:1px solid rgba(255,255,255,.35);

    border-radius:24px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.85),
        0 0 15px rgba(255,255,255,.12),
        0 0 30px rgba(255,255,255,.05);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    z-index:999999;
}


/* NAV BUTTON */

.bottom-nav .nav-item{

    position:relative;

    width:70px;
    height:58px;

    border:0 !important;

    background:transparent !important;

    color:rgba(255,255,255,.35) !important;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:28px;

    padding:0;

    transition:.25s ease;

    -webkit-tap-highlight-color:transparent;
}


/* ICON */

.bottom-nav .nav-icon{

    font-size:28px;

    color:rgba(255,255,255,.40);

    transition:.25s ease;

    filter:none;
}


/* =====================================================
   ACTIVE PAGE GLOW
===================================================== */

.bottom-nav .nav-item.active .nav-icon{

    color:#fff !important;

    text-shadow:
        0 0 5px #fff,
        0 0 12px #fff,
        0 0 24px rgba(255,255,255,.85),
        0 0 40px rgba(255,255,255,.45);

    transform:scale(1.10);
}


/* ACTIVE BUTTON GLOW */

.bottom-nav .nav-item.active{

    color:#fff !important;

    filter:
        drop-shadow(0 0 6px #fff)
        drop-shadow(0 0 12px rgba(255,255,255,.7));
}


/* ACTIVE DOT */

.bottom-nav .nav-item.active::after{

    content:"";

    position:absolute;

    bottom:2px;
    left:50%;

    width:5px;
    height:5px;

    transform:translateX(-50%);

    background:#fff;

    border-radius:50%;

    box-shadow:
        0 0 6px #fff,
        0 0 14px #fff,
        0 0 25px rgba(255,255,255,.8);
}


/* TOUCH EFFECT */

.bottom-nav .nav-item:active{

    transform:scale(.88);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    #walletPage{
        padding:20px 15px 110px;
    }

    .wallet-balance{
        padding:21px 17px 18px;
        border-radius:23px;
    }

    .balance-amount{
        font-size:38px;
    }

    .wallet-btn{
        height:46px;
    }

    .wallet-stat{
        min-height:95px;
    }

    .stat-value{
        font-size:20px;
    }

    .bottom-nav{
        left:14px;
        right:14px;
        bottom:14px;
        height:70px;
        border-radius:23px;
    }

}

</style>


<!-- =====================================================
     WALLET CONTENT
===================================================== -->

<div class="wallet-wrap">


    <!-- BALANCE -->

    <div class="wallet-balance">

        <div class="balance-label">
            Total Balance
        </div>

        <div class="balance-amount">
            ₹0.00
        </div>

        <div class="balance-line"></div>


        <div class="money-row">

            <div class="money-name">
                Win Money
            </div>

            <div class="money-value">
                ₹0.00
            </div>

        </div>


        <div class="money-row">

            <div class="money-name">
                Join Money
            </div>

            <div class="money-value">
                ₹0.00
            </div>

        </div>


        <!-- BUTTONS -->

        <div class="wallet-actions">

            <button
                class="wallet-btn"
                onclick="addMoney()">

                ADD MONEY

            </button>


            <button
                class="wallet-btn"
                onclick="withdrawMoney()">

                WITHDRAW

            </button>

        </div>

    </div>


    <!-- =================================================
         STATS
    ================================================== -->

    <div class="wallet-stats">


        <div class="wallet-stat">

            <div class="stat-label">
                EARNINGS
            </div>

            <div class="stat-value">
                ₹0.00
            </div>

        </div>


        <div class="wallet-stat">

            <div class="stat-label">
                PAYOUTS
            </div>

            <div class="stat-value">
                ₹0.00
            </div>

        </div>


    </div>


    <!-- =================================================
         HISTORY
    ================================================== -->

    <div class="history-title">
        WALLET HISTORY
    </div>


    <div class="wallet-history">
        No wallet transactions yet.
    </div>


</div>


<!-- =====================================================
     BOTTOM NAVIGATION
===================================================== -->

<nav class="bottom-nav">


    <!-- HOME -->

    <button
        class="nav-item"
        data-page="home"
        onclick="goHome()">

        <span class="nav-icon">
            ⌂
        </span>

    </button>


    <!-- WALLET ACTIVE -->

    <button
        class="nav-item active"
        data-page="wallet"
        onclick="goWallet()">

        <span class="nav-icon">
            ▣
        </span>

    </button>


    <!-- PROFILE -->

    <button
        class="nav-item"
        data-page="profile"
        onclick="goProfile()">

        <span class="nav-icon">
            ♟
        </span>

    </button>


</nav>


</section>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

function addMoney(){

    alert("Add Money");

}


function withdrawMoney(){

    alert("Withdraw");

}


function goHome(){

    window.location.href = "index.html";

}


function goWallet(){

    window.location.href = "wallet.html";

}


function goProfile(){

    window.location.href = "profile.html";

}

</script>


</body>
</html>
