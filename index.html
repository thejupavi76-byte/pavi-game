<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ PAVI GAME 🎯</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:#000;
}

body{
    background:#000;
    color:#fff;
    font-family:'Chakra Petch',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
}

/* ================= HEADER ================= */

.top-header{
    min-height:190px;
    padding:28px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    border-bottom:1px solid #333;

    background:
    radial-gradient(circle at center,
    rgba(255,255,255,.08),
    transparent 55%);
}

.header-avatar{
    width:88px;
    height:88px;
    flex-shrink:0;

    border-radius:50%;
    background:#050505;

    border:1px solid #fff;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 0 6px #fff,
    0 0 18px rgba(255,255,255,.55),
    0 0 35px rgba(255,255,255,.18);
}

.header-avatar img{
    width:58px;
    height:58px;
    object-fit:cover;
    border-radius:50%;
}

.welcome{
    text-align:center;
    flex:1;
}

.welcome-small{
    color:#aaa;
    font-size:12px;
    margin-bottom:7px;
}

.welcome-name{
    font-size:24px;
    font-weight:700;

    text-shadow:
    0 0 5px #fff,
    0 0 12px #fff,
    0 0 25px rgba(255,255,255,.6);
}

.header-wallet{
    width:118px;
    height:70px;

    border-radius:22px;

    background:#050505;

    border:1px solid #fff;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    box-shadow:
    0 0 6px #fff,
    0 0 18px rgba(255,255,255,.4);
}

.coin{
    width:25px;
    height:25px;

    border-radius:50%;

    background:#f5c400;
    color:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
}

.balance{
    font-size:17px;
    font-weight:600;
}

/* ================= MAIN ================= */

.main{
    max-width:700px;
    margin:auto;
    padding:28px 20px 40px;
}

/* ================= PAVI GAME ================= */

.hero{
    min-height:215px;

    border-radius:28px;

    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
    linear-gradient(
        90deg,
        rgba(0,0,0,.55),
        rgba(0,0,0,.88)
    ),
    url("eren.jpg") center/cover no-repeat;

    border:1px solid #fff;

    box-shadow:
    0 0 7px #fff,
    0 0 20px rgba(255,255,255,.45),
    0 0 40px rgba(255,255,255,.15);
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-title{
    font-size:30px;
    font-weight:700;

    text-shadow:
    0 0 5px #fff,
    0 0 12px #fff,
    0 0 25px rgba(255,255,255,.6);
}

.hero-subtitle{
    margin-top:10px;
    color:#bbb;
    font-size:14px;
}

/* ================= SECTION ================= */

.section{
    margin-top:38px;
}

.section-title{
    text-align:center;

    font-size:23px;
    font-weight:700;

    margin-bottom:23px;

    text-shadow:
    0 0 5px #fff,
    0 0 15px rgba(255,255,255,.6);
}

.section-title::after{
    content:"";

    display:block;

    width:70px;
    height:2px;

    margin:10px auto 0;

    background:#fff;

    box-shadow:
    0 0 7px #fff,
    0 0 18px #fff;
}

/* ================= MY MATCHES ================= */

.match-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.match-card{
    min-height:190px;

    border-radius:21px;

    background:#050505;

    border:1px solid rgba(255,255,255,.65);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 0 6px rgba(255,255,255,.45),
    0 0 18px rgba(255,255,255,.15);
}

.match-icon{
    width:75px;
    height:75px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:40px;

    background:#050505;

    border:1px solid rgba(255,255,255,.7);

    box-shadow:
    0 0 7px rgba(255,255,255,.5);

    margin-bottom:14px;
}

.match-name{
    font-size:15px;
    font-weight:700;
}

.match-count{
    margin-top:7px;
    color:#aaa;
}

/* ================= TABS ================= */

.tabs{
    height:57px;

    display:grid;
    grid-template-columns:1fr 1fr;

    overflow:hidden;

    border-radius:15px;

    border:1px solid #777;

    background:#080808;
}

.tab{
    border:0;
    background:#080808;
    color:#888;

    font-family:inherit;
    font-weight:700;
    font-size:14px;
}

.tab.active{
    background:#fff;
    color:#000;

    box-shadow:
    0 0 12px rgba(255,255,255,.6);
}

/* ================= GAME GRID ================= */

.game-grid{
    margin-top:23px;

    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:16px;
}

.game-card{
    position:relative;
    overflow:hidden;

    height:275px;

    border-radius:21px;

    background:#050505;

    border:1px solid rgba(255,255,255,.7);

    box-shadow:
    0 0 7px rgba(255,255,255,.5),
    0 0 20px rgba(255,255,255,.15);
}

.game-image{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.game-card::after{
    content:"";

    position:absolute;
    inset:0;

    background:
    linear-gradient(
        to bottom,
        transparent 30%,
        rgba(0,0,0,.25) 50%,
        rgba(0,0,0,.96) 100%
    );
}

.game-info{
    position:absolute;

    z-index:5;

    left:13px;
    right:13px;
    bottom:12px;
}

.game-title{
    font-size:15px;
    font-weight:700;

    margin-bottom:9px;

    text-shadow:
    0 0 5px #fff,
    0 0 10px rgba(255,255,255,.6);
}

.join-btn{
    width:100%;
    height:40px;

    border-radius:12px;

    background:rgba(0,0,0,.8);

    color:#fff;

    border:1px solid #fff;

    font-family:inherit;
    font-weight:700;

    box-shadow:
    0 0 5px rgba(255,255,255,.35);
}

.join-btn:active{
    background:#fff;
    color:#000;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:82px;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:#050505;

    border-top:1px solid #333;

    box-shadow:
    0 -5px 25px rgba(255,255,255,.08);
}

.nav-item{
    width:33.33%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:#777;

    font-size:12px;
}

.nav-icon{
    font-size:25px;
    margin-bottom:6px;
}

.nav-item.active{
    color:#fff;

    text-shadow:
    0 0 5px #fff,
    0 0 15px rgba(255,255,255,.7);
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    body{
        padding-bottom:72px;
    }

    /* HEADER */
    .top-header{
        min-height:145px;
        padding:18px 12px;
        gap:8px;
    }

    .header-avatar{
        width:65px;
        height:65px;
    }

    .header-avatar img{
        width:44px;
        height:44px;
    }

    .header-wallet{
        width:92px;
        height:55px;
        border-radius:17px;
    }

    .balance{
        font-size:14px;
    }

    .welcome-name{
        font-size:18px;
    }

    .welcome-small{
        font-size:10px;
        margin-bottom:4px;
    }


    /* MAIN */
    .main{
        padding:16px 12px 25px;
    }


    /* HERO */
    .hero{
        min-height:150px;
        height:150px;
        border-radius:20px;
    }

    .hero-title{
        font-size:22px;
    }

    .hero-subtitle{
        font-size:11px;
        margin-top:6px;
    }


    /* SECTIONS */
    .section{
        margin-top:24px;
    }

    .section-title{
        font-size:18px;
        margin-bottom:14px;
    }

    .section-title::after{
        width:50px;
        margin-top:6px;
    }


    /* MY MATCHES */
    .match-grid{
        gap:8px;
    }

    .match-card{
        min-height:125px;
        border-radius:16px;
    }

    .match-icon{
        width:50px;
        height:50px;
        border-radius:14px;
        font-size:27px;
        margin-bottom:8px;
    }

    .match-name{
        font-size:11px;
    }

    .match-count{
        font-size:10px;
        margin-top:4px;
    }


    /* TABS */
    .tabs{
        height:48px;
        border-radius:13px;
    }

    .tab{
        font-size:11px;
    }


    /* GAME GRID */
    .game-grid{
        margin-top:14px;
        gap:9px;
    }

    .game-card{
        height:205px;
        border-radius:16px;
    }

    .game-info{
        left:9px;
        right:9px;
        bottom:8px;
    }

    .game-title{
        font-size:10px;
        margin-bottom:6px;
    }

    .join-btn{
        height:31px;
        border-radius:9px;
        font-size:10px;
    }


    /* BOTTOM NAV */
    .bottom-nav{
        height:72px;
    }

    .nav-icon{
        font-size:21px;
        margin-bottom:3px;
    }

    .nav-item{
        font-size:10px;
    }
}
/* ===== PREMIUM BOTTOM NAVIGATION ===== */

.bottom-nav {
    position: fixed;
    left: 18px;
    right: 18px;
    bottom: 18px;

    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-around;

    background: rgba(18, 18, 22, 0.88);

    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 24px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.75),
        0 0 25px rgba(255,255,255,0.06);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    z-index: 99999;

    padding: 0 8px;
}


/* NAV BUTTON */

.nav-item {
    position: relative;

    width: 64px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent !important;
    border: none !important;

    color: rgba(255,255,255,0.38);

    border-radius: 18px;

    transition:
        transform 0.25s ease,
        color 0.25s ease,
        background 0.25s ease;
}


/* ICON */

.nav-icon {
    font-size: 30px;

    color: rgba(255,255,255,0.38);

    transition:
        transform 0.25s ease,
        color 0.25s ease,
        text-shadow 0.25s ease;
}


/* ACTIVE PAGE */

.nav-item.active {
    background: rgba(255,255,255,0.09) !important;

    box-shadow:
        inset 0 0 15px rgba(255,255,255,0.04);
}


/* ACTIVE ICON PREMIUM GLOW */

.nav-item.active .nav-icon {
    color: #ffffff;

    transform: scale(1.12);

    text-shadow:
        0 0 5px rgba(255,255,255,0.95),
        0 0 12px rgba(255,255,255,0.75),
        0 0 24px rgba(255,255,255,0.35);
}


/* ACTIVE SMALL GLOW DOT */

.nav-item.active::after {
    content: "";

    position: absolute;

    bottom: 5px;
    left: 50%;

    width: 5px;
    height: 5px;

    transform: translateX(-50%);

    background: #ffffff;

    border-radius: 50%;

    box-shadow:
        0 0 6px #ffffff,
        0 0 12px rgba(255,255,255,0.8);
}


/* TOUCH EFFECT */

.nav-item:active {
    transform: scale(0.88);
}


/* PAGE SPACE */

body {
    padding-bottom: 110px;
}
    /* =====================================================
   PAVI GAME — MOBILE CLEAN + SCROLL VERSION
===================================================== */

*{
    box-sizing:border-box;
}

html{
    width:100%;
    min-height:100%;
    margin:0;
    padding:0;
    background:#000;
    overflow-x:hidden;
}

body{
    width:100%;
    min-height:100vh;
    margin:0 !important;
    padding:0 0 95px 0 !important;

    background:#000 !important;
    color:#fff !important;

    overflow-x:hidden !important;
    overflow-y:auto !important;

    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:none;
}


/* =====================================================
   HEADER
===================================================== */

.header,
.top-header,
.home-header{
    width:100% !important;
    height:92px !important;
    min-height:92px !important;

    padding:8px 22px !important;

    display:flex !important;
    align-items:center !important;
    justify-content:space-between !important;

    background:#000 !important;

    border-bottom:1px solid rgba(255,255,255,.18);
}


/* PROFILE */

.profile-img,
.user-avatar,
.header-avatar{
    width:58px !important;
    height:58px !important;

    flex:0 0 58px !important;

    border-radius:50% !important;

    object-fit:cover !important;

    border:2px solid #fff !important;

    box-shadow:
        0 0 8px rgba(255,255,255,.8),
        0 0 20px rgba(255,255,255,.35) !important;
}


/* HEADER CENTER */

.welcome,
.welcome-text,
.header-welcome{
    flex:1 !important;
    min-width:0 !important;

    text-align:center !important;

    padding:0 8px !important;
}

.welcome small,
.welcome p,
.welcome-subtitle,
.header-welcome small{
    display:block !important;

    margin:0 0 3px !important;

    color:#aaa !important;

    font-size:11px !important;
    line-height:14px !important;
}

.welcome h1,
.welcome h2,
.user-name,
.header-name{
    margin:0 !important;

    color:#fff !important;

    font-size:20px !important;
    line-height:22px !important;

    white-space:nowrap !important;

    text-shadow:
        0 0 5px #fff,
        0 0 14px rgba(255,255,255,.5) !important;
}


/* BALANCE */

.balance-box,
.header-balance,
.wallet-balance{
    width:96px !important;
    height:54px !important;

    flex:0 0 96px !important;

    display:flex !important;
    align-items:center !important;
    justify-content:center !important;

    border:1.5px solid #fff !important;

    border-radius:18px !important;

    background:#030303 !important;

    box-shadow:
        0 0 8px rgba(255,255,255,.6),
        inset 0 0 10px rgba(255,255,255,.04) !important;
}


/* =====================================================
   HERO
===================================================== */

.hero,
.banner,
.game-banner,
.pavi-banner{
    width:calc(100% - 48px) !important;

    height:125px !important;

    margin:18px 24px 10px !important;

    border-radius:24px !important;

    overflow:hidden !important;

    border:1.5px solid #fff !important;

    box-shadow:
        0 0 10px rgba(255,255,255,.65),
        0 0 25px rgba(255,255,255,.18) !important;
}


/* =====================================================
   SECTION TITLES
===================================================== */

.section-title,
.section-heading{
    margin:14px 0 10px !important;

    text-align:center !important;

    color:#fff !important;

    font-size:22px !important;
    line-height:26px !important;

    text-shadow:
        0 0 5px #fff,
        0 0 14px rgba(255,255,255,.4) !important;
}


/* Avoid affecting every h2 on page */
.matches-grid ~ h2,
.stats-grid ~ h2{
    text-align:center !important;
}


/* =====================================================
   MY MATCHES
===================================================== */

.matches-grid,
.match-grid,
.stats-grid{
    width:calc(100% - 48px) !important;

    margin:0 24px !important;

    display:grid !important;

    grid-template-columns:
        repeat(3,minmax(0,1fr)) !important;

    gap:9px !important;
}


.match-card,
.stat-card{
    width:100% !important;

    min-width:0 !important;

    height:104px !important;
    min-height:104px !important;

    padding:8px 5px !important;

    border:1px solid rgba(255,255,255,.75) !important;

    border-radius:18px !important;

    background:#030303 !important;

    box-shadow:
        0 0 9px rgba(255,255,255,.28) !important;
}


/* Match icons */

.match-card i,
.match-card svg,
.stat-card i,
.stat-card svg{
    max-width:38px !important;
    max-height:38px !important;
}


/* Match text */

.match-card h3,
.match-card h4,
.stat-card h3,
.stat-card h4{
    margin:4px 0 !important;

    font-size:12px !important;
}


/* =====================================================
   ESPORTS TITLE
===================================================== */

.esports-title,
.games-title{
    margin:14px 0 10px !important;

    text-align:center !important;

    font-size:22px !important;
    line-height:26px !important;

    color:#fff !important;

    text-shadow:
        0 0 5px #fff,
        0 0 14px rgba(255,255,255,.4) !important;
}


/* =====================================================
   TOURNAMENT / SOLO
===================================================== */

.game-tabs,
.tabs,
.category-tabs{
    width:calc(100% - 48px) !important;

    height:48px !important;

    margin:8px 24px 10px !important;

    display:flex !important;

    overflow:hidden !important;

    border:1px solid #fff !important;

    border-radius:16px !important;
}


/* =====================================================
   GAME GRID
===================================================== */

.games-grid,
.game-grid,
.esports-grid,
.games-container{
    width:calc(100% - 48px) !important;

    margin:0 24px 25px !important;

    display:grid !important;

    grid-template-columns:
        repeat(2,minmax(0,1fr)) !important;

    gap:9px !important;

    overflow:visible !important;
}


/* =====================================================
   GAME CARD
===================================================== */

.game-card,
.esports-card{
    width:100% !important;

    height:145px !important;
    min-height:145px !important;

    position:relative !important;

    overflow:hidden !important;

    border:1px solid rgba(255,255,255,.8) !important;

    border-radius:17px !important;

    background:#050505 !important;

    box-shadow:
        0 0 8px rgba(255,255,255,.35) !important;
}


/* GAME IMAGE */

.game-card img,
.esports-card img{
    width:100% !important;
    height:100% !important;

    display:block !important;

    object-fit:cover !important;
}


/* IMAGE DARKNESS */

.game-card::after,
.esports-card::after{
    content:"";

    position:absolute !important;

    inset:0 !important;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.03),
            rgba(0,0,0,.75)
        ) !important;

    pointer-events:none !important;
}


/* =====================================================
   GAME CONTENT
===================================================== */

.game-card-content,
.esports-card-content{
    position:absolute !important;

    left:10px !important;
    right:10px !important;
    bottom:8px !important;

    z-index:5 !important;

    padding:0 !important;
}


/* GAME NAME */

.game-title,
.game-name,
.esports-title{
    display:block !important;

    margin:0 0 5px !important;

    color:#fff !important;

    font-size:12px !important;
    line-height:15px !important;

    font-weight:800 !important;

    white-space:nowrap !important;

    overflow:hidden !important;
    text-overflow:ellipsis !important;

    text-shadow:
        0 0 5px #000,
        0 0 8px rgba(255,255,255,.4) !important;
}


/* =====================================================
   JOIN BUTTON
===================================================== */

.game-card button,
.join-btn,
.game-button{
    width:100% !important;

    height:34px !important;

    padding:0 !important;

    border:1px solid #fff !important;

    border-radius:11px !important;

    background:rgba(0,0,0,.85) !important;

    color:#fff !important;

    font-size:11px !important;

    font-weight:700 !important;

    box-shadow:
        0 0 6px rgba(255,255,255,.3) !important;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.bottom-nav{
    position:fixed !important;

    left:24px !important;
    right:24px !important;
    bottom:10px !important;

    width:auto !important;

    height:64px !important;

    z-index:999999 !important;

    display:flex !important;

    border-radius:21px !important;

    background:
        rgba(8,8,10,.97) !important;

    border:1px solid rgba(255,255,255,.65) !important;

    box-shadow:
        0 0 14px rgba(255,255,255,.18) !important;

    backdrop-filter:blur(14px) !important;
}


/* NAV ITEMS */

.bottom-nav .nav-item{
    width:33.333% !important;
    height:62px !important;

    display:flex !important;
    align-items:center !important;
    justify-content:center !important;

    background:transparent !important;

    border:0 !important;

    color:#555 !important;
}


/* ACTIVE */

.bottom-nav .nav-item.active{
    color:#fff !important;

    text-shadow:
        0 0 7px #fff,
        0 0 15px rgba(255,255,255,.5) !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    body{
        min-height:100vh !important;

        /* SCROLL ENABLED */
        overflow-x:hidden !important;
        overflow-y:auto !important;

        padding-bottom:100px !important;
    }


    /* HEADER */

    .header,

<script>
    function goHome() {
    window.location.href = "index.html";
}

function goWallet() {
    window.location.href = "wallet.html";
}

function goProfile() {
    window.location.href = "profile.html";
}

document.addEventListener("DOMContentLoaded", function () {

    const path = window.location.pathname.toLowerCase();

    let currentPage = "home";

    if (path.includes("wallet")) {
        currentPage = "wallet";
    } 
    else if (path.includes("profile")) {
        currentPage = "profile";
    }

    document.querySelectorAll(".nav-item").forEach(function (item) {

        if (item.dataset.page === currentPage) {
            item.classList.add("active");
        } else {
            item.classList.remove("active");
        }

    });

});
</script>
