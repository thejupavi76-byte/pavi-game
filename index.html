<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ PAVI GAME 🎯</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100%;
}

body{
    padding-bottom:82px;
}

/* ================= HEADER ================= */

.header{
    height:135px;
    padding:18px;
    background:#000;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 3px 18px rgba(255,255,255,.10);
}

.logo{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#050505;
    border:1px solid #777;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;

    box-shadow:
        0 0 6px #fff,
        0 0 14px rgba(255,255,255,.35);
}

.welcome{
    text-align:center;
}

.welcome small{
    font-size:11px;
    color:#aaa;
}

.welcome h1{
    font-size:20px;
    margin-top:5px;
    letter-spacing:.7px;

    /* subtle edge glow only */
    text-shadow:
        0 0 3px #fff,
        0 0 7px rgba(255,255,255,.35);
}

.wallet{
    background:#050505;
    border:1px solid #777;
    padding:13px 15px;
    border-radius:18px;
    font-size:16px;
    font-weight:bold;

    box-shadow:
        0 0 7px #fff,
        inset 0 0 10px rgba(255,255,255,.06);
}

.coin{
    color:#ffd21f;
}

/* ================= BANNER ================= */

.banner{
    margin:22px 18px 0;
    height:155px;
    border-radius:18px;
    background:#080808;
    border:1px solid #777;

    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    box-shadow:
        0 0 7px #fff,
        0 0 20px rgba(255,255,255,.20);
}

.banner h2{
    font-size:27px;
    letter-spacing:.8px;

    /* small premium glow */
    text-shadow:
        0 0 3px #fff,
        0 0 8px rgba(255,255,255,.45);
}

.banner p{
    margin-top:9px;
    color:#aaa;
    font-size:14px;
}

/* ================= SECTION TITLES ================= */

.section-title{
    text-align:center;
    font-size:22px;
    margin:30px 0 20px;

    text-shadow:
        0 0 3px #fff,
        0 0 8px rgba(255,255,255,.35);
}

/* ================= MATCHES ================= */

.matches{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    padding:0 16px;
}

.match{
    height:145px;
    border-radius:14px;
    background:#080808;
    border:1px solid #555;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 6px rgba(255,255,255,.65),
        inset 0 0 12px rgba(255,255,255,.03);
}

.match-icon{
    width:60px;
    height:60px;
    border-radius:14px;
    background:#0a0a0a;
    border:1px solid #777;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
    margin-bottom:12px;

    box-shadow:
        0 0 7px rgba(255,255,255,.55);
}

.match span{
    font-size:14px;
    font-weight:bold;
}

/* ================= TABS ================= */

.tabs{
    margin:0 16px 25px;
    display:flex;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #555;
}

.tab{
    width:50%;
    padding:16px 5px;
    text-align:center;

    background:#111;
    color:#999;

    font-size:15px;
    font-weight:bold;
}

.tab.active{
    background:#fff;
    color:#000;

    box-shadow:
        0 0 8px #fff;
}

/* ================= GAMES ================= */

.games{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px 12px;
    padding:0 16px;
}

.game{
    text-align:center;
    cursor:pointer;
}

.game-img{
    height:175px;
    border-radius:15px;
    position:relative;
    overflow:hidden;

    background:#050505;
    border:1px solid #777;

    box-shadow:
        0 0 7px #fff,
        0 0 18px rgba(255,255,255,.22);
}

/* IMAGE */

.game-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* DARK BOTTOM OVERLAY */

.game-img::after{
    content:"";
    position:absolute;
    inset:0;

    background:linear-gradient(
        to bottom,
        transparent 50%,
        rgba(0,0,0,.15) 65%,
        rgba(0,0,0,.85) 100%
    );

    pointer-events:none;
}

/* TITLE INSIDE IMAGE */

.game-title{
    position:absolute;
    z-index:3;

    bottom:12px;
    left:0;
    width:100%;

    padding:0 3px;

    text-align:center;

    color:#fff;
    font-size:15px;
    font-weight:900;
    letter-spacing:.4px;

    text-shadow:
        0 0 3px #fff,
        0 0 7px rgba(255,255,255,.65);
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:78px;

    background:#050505;
    border-top:1px solid #444;

    display:flex;
    justify-content:space-around;
    align-items:center;

    z-index:100;

    box-shadow:
        0 -4px 18px rgba(255,255,255,.10);
}

.nav-item{
    text-align:center;
    color:#777;
    font-size:12px;
    cursor:pointer;
}

.nav-icon{
    font-size:25px;
    margin-bottom:4px;

    filter:drop-shadow(0 0 3px #fff);
}

.nav-item.active{
    color:#fff;

    text-shadow:
        0 0 5px #fff;
}

/* ================= PAGES ================= */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* ================= WALLET / PROFILE ================= */

.simple-page{
    min-height:calc(100vh - 135px);
    padding:35px 20px;
    text-align:center;
}

.simple-card{
    background:#080808;
    border:1px solid #777;
    border-radius:20px;

    padding:35px 20px;
    margin-top:30px;

    box-shadow:
        0 0 7px #fff,
        0 0 22px rgba(255,255,255,.20);
}

.simple-card h2{
    font-size:24px;
    margin-bottom:15px;

    text-shadow:
        0 0 4px #fff,
        0 0 8px rgba(255,255,255,.45);
}

.simple-card p{
    color:#aaa;
    line-height:1.6;
}

/* ================= MOBILE ================= */

@media(max-width:380px){

    .header{
        padding:15px;
    }

    .logo{
        width:48px;
        height:48px;
        font-size:23px;
    }

    .welcome h1{
        font-size:18px;
    }

    .wallet{
        padding:11px 10px;
        font-size:14px;
    }

    .game-img{
        height:155px;
    }

    .game-title{
        font-size:13px;
    }
}
</style>
</head>

<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="logo">
        🎮
    </div>

    <div class="welcome">
        <small>Welcome Back,</small>
        <h1>EREN YEAGER</h1>
    </div>

    <div class="wallet">
        <span class="coin">🪙</span> 0.00
    </div>

</header>


<!-- ================= HOME ================= -->

<div id="homePage" class="page active">

    <!-- PAVI GAME -->

    <div class="banner">
        <div>
            <h2>⚡ PAVI GAME 🎯</h2>
            <p>Play • Compete • Win</p>
        </div>
    </div>


    <!-- MY MATCHES -->

    <h2 class="section-title">
        My Matches
    </h2>

    <div class="matches">

        <div class="match">
            <div class="match-icon">↻</div>
            <span>Ongoing</span>
        </div>

        <div class="match">
            <div class="match-icon">□</div>
            <span>Upcoming</span>
        </div>

        <div class="match">
            <div class="match-icon">✓</div>
            <span>Completed</span>
        </div>

    </div>


    <!-- ESPORTS -->

    <h2 class="section-title">
        Esports Games
    </h2
