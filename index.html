<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAVI GAME 🎮</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080014;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding-bottom:85px;
}

.header{
    height:155px;
    padding:20px 18px;
    background:#0b0015;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #251033;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:55px;
    height:55px;
    border-radius:50%;
    background:radial-gradient(circle,#d96cff,#5b00ff,#18002e);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    box-shadow:0 0 18px #8b00ff;
}

.welcome{
    text-align:center;
}

.welcome small{
    font-size:17px;
    color:#ddd;
}

.welcome h1{
    font-size:25px;
    margin-top:5px;
}

.wallet{
    background:linear-gradient(135deg,#6b00ff,#a000ff);
    padding:14px 20px;
    border-radius:20px;
    font-size:21px;
    font-weight:bold;
    box-shadow:0 0 15px #5500aa;
}

.coin{
    color:#ffd42a;
}

.banner{
    margin:0 18px;
    height:145px;
    border-radius:15px;
    background:
      linear-gradient(135deg,#29004d,#7500d9,#17002d);
    border:2px solid #8d00ff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    box-shadow:0 0 20px #6200a8;
}

.banner h2{
    font-size:31px;
    color:#fff;
    text-shadow:0 0 12px #d100ff;
}

.banner p{
    margin-top:8px;
    color:#ddd;
}

.section-title{
    text-align:center;
    font-size:25px;
    margin:30px 0 20px;
}

.matches{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding:0 18px;
}

.match{
    height:165px;
    border-radius:8px;
    background:linear-gradient(145deg,#23003e,#150024);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    border:1px solid #31005a;
}

.match-icon{
    width:65px;
    height:65px;
    border-radius:15px;
    background:linear-gradient(135deg,#1700c9,#006eff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    margin-bottom:14px;
}

.match span{
    font-size:20px;
}

.tabs{
    margin:0 18px 30px;
    display:flex;
    border-radius:9px;
    overflow:hidden;
}

.tab{
    width:50%;
    padding:18px 5px;
    text-align:center;
    background:#ddd9e2;
    color:white;
    font-size:21px;
    font-weight:bold;
}

.tab.active{
    background:linear-gradient(90deg,#5700ff,#7200ff);
}

.games{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px 14px;
    padding:0 20px;
}

.game{
    text-align:center;
    cursor:pointer;
}

.game-img{
    height:105px;
    border-radius:12px;
    background:
      radial-gradient(circle at 50% 40%,#b000ff,#4a00a0 45%,#12001e 75%);
    border:2px solid #8d00ff;
    box-shadow:0 0 12px #6500aa;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.game-img:before{
    content:"⚡";
    font-size:55px;
