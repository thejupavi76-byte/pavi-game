<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>⚡ PAVI GAME 🎯</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    background:#000;
}

body{
    background:#000;
    color:#fff;
    font-family:'Chakra Petch',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
}

/* ================= HEADER ================= */

.top-header{
    min-height:190px;
    padding:28px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;

    border-bottom:1px solid #333;

    background:
    radial-gradient(circle at center,
    rgba(255,255,255,.08),
    transparent 55%);
}

.header-avatar{
    width:88px;
    height:88px;
    flex-shrink:0;

    border-radius:50%;
    background:#050505;

    border:1px solid #fff;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 0 6px #fff,
    0 0 18px rgba(255,255,255,.55),
    0 0 35px rgba(255,255,255,.18);
}

.header-avatar img{
    width:58px;
    height:58px;
    object-fit:cover;
    border-radius:50%;
}

.welcome{
    text-align:center;
    flex:1;
}

.welcome-small{
    color:#aaa;
    font-size:12px;
    margin-bottom:7px;
}

.welcome-name{
    font-size:24px;
    font-weight:700;

    text-shadow:
    0 0 5px #fff,
    0 0 12px #fff,
    0 0 25px rgba(255,255,255,.6);
}

.header-wallet{
    width:118px;
    height:70px;

    border-radius:22px;

    background:#050505;

    border:1px solid #fff;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    box-shadow:
    0 0 6px #fff,
    0 0 18px rgba(255,255,255,.4);
}

.coin{
    width:25px;
    height:25px;

    border-radius:50%;

    background:#f5c400;
    color:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:bold;
}

.balance{
    font-size:17px;
    font-weight:600;
}

/* ================= MAIN ================= */

.main{
    max-width:700px;
    margin:auto;
    padding:28px 20px 40px;
}

/* ================= PAVI GAME ================= */

.hero{
    min-height:215px;

    border-radius:28px;

    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
    linear-gradient(
        90deg,
        rgba(0,0,0,.55),
        rgba(0,0,0,.88)
    ),
    url("eren.jpg") center/cover no-repeat;

    border:1px solid #fff;

    box-shadow:
    0 0 7px #fff,
    0 0 20px rgba(255,255,255,.45),
    0 0 40px rgba(255,255,255,.15);
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero-title{
    font-size:30px;
    font-weight:700;

    text-shadow:
    0 0 5px #fff,
    0 0 12px #fff,
    0 0 25px rgba(255,255,255,.6);
}

.hero-subtitle{
    margin-top:10px;
    color:#bbb;
    font-size:14px;
}

/* ================= SECTION ================= */

.section{
    margin-top:38px;
}

.section-title{
    text-align:center;

    font-size:23px;
    font-weight:700;

    margin-bottom:23px;

    text-shadow:
    0 0 5px #fff,
    0 0 15px rgba(255,255,255,.6);
}

.section-title::after{
    content:"";

    display:block;

    width:70px;
    height:2px;

    margin:10px auto 0;

    background:#fff;

    box-shadow:
    0 0 7px #fff,
    0 0 18px #fff;
}

/* ================= MY MATCHES ================= */

.match-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
}

.match-card{
    min-height:190px;

    border-radius:21px;

    background:#050505;

    border:1px solid rgba(255,255,255,.65);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    box-shadow:
    0 0 6px rgba(255,255,255,.45),
    0 0 18px rgba(255,255,255,.15);
}

.match-icon{
    width:75px;
    height:75px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:40px;

    background:#050505;

    border:1px solid rgba(255,255,255,.7);

    box-shadow:
    0 0 7px rgba(255,255,255,.5);

    margin-bottom:14px;
}

.match-name{
    font-size:15px;
    font-weight:700;
}

.match-count{
    margin-top:7px;
    color:#aaa;
}

/* ================= TABS ================= */

.tabs{
    height:57px;

    display:grid;
    grid-template-columns:1fr 1fr;

    overflow:hidden;

    border-radius:15px;

    border:1px solid #777;

    background:#080808;
}

.tab{
    border:0;
    background:#080808;
    color:#888;

    font-family:inherit;
    font-weight:700;
    font-size:14px;
}

.tab.active{
    background:#fff;
    color:#000;

    box-shadow:
    0 0 12px rgba(255,255,255,.6);
}

/* ================= GAME GRID ================= */

.game-grid{
    margin-top:23px;

    display:grid;
    grid-template-columns:repeat(2,1fr);

    gap:16px;
}

.game-card{
    position:relative;
    overflow:hidden;

    height:275px;

    border-radius:21px;

    background:#050505;

    border:1px solid rgba(255,255,255,.7);

    box-shadow:
    0 0 7px rgba(255,255,255,.5),
    0 0 20px rgba(255,255,255,.15);
}

.game-image{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.game-card::after{
    content:"";

    position:absolute;
    inset:0;

    background:
    linear-gradient(
        to bottom,
        transparent 30%,
        rgba(0,0,0,.25) 50%,
        rgba(0,0,0,.96) 100%
    );
}

.game-info{
    position:absolute;

    z-index:5;

    left:13px;
    right:13px;
    bottom:12px;
}

.game-title{
    font-size:15px;
    font-weight:700;

    margin-bottom:9px;

    text-shadow:
    0 0 5px #fff,
    0 0 10px rgba(255,255,255,.6);
}

.join-btn{
    width:100%;
    height:40px;

    border-radius:12px;

    background:rgba(0,0,0,.8);

    color:#fff;

    border:1px solid #fff;

    font-family:inherit;
    font-weight:700;

    box-shadow:
    0 0 5px rgba(255,255,255,.35);
}

.join-btn:active{
    background:#fff;
    color:#000;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:82px;

    z-index:100;

    display:flex;
    align-items:center;
    justify-content:space-around;

    background:#050505;

    border-top:1px solid #333;

    box-shadow:
    0 -5px 25px rgba(255,255,255,.08);
}

.nav-item{
    width:33.33%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    color:#777;

    font-size:12px;
}

.nav-icon{
    font-size:25px;
    margin-bottom:6px;
}

.nav-item.active{
    color:#fff;

    text-shadow:
    0 0 5px #fff,
    0 0 15px rgba(255,255,255,.7);
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    body{
        padding-bottom:72px;
    }

    /* HEADER */
    .top-header{
        min-height:145px;
        padding:18px 12px;
        gap:8px;
    }

    .header-avatar{
        width:65px;
        height:65px;
    }

    .header-avatar img{
        width:44px;
        height:44px;
    }

    .header-wallet{
        width:92px;
        height:55px;
        border-radius:17px;
    }

    .balance{
        font-size:14px;
    }

    .welcome-name{
        font-size:18px;
    }

    .welcome-small{
        font-size:10px;
        margin-bottom:4px;
    }


    /* MAIN */
    .main{
        padding:16px 12px 25px;
    }


    /* HERO */
    .hero{
        min-height:150px;
        height:150px;
        border-radius:20px;
    }

    .hero-title{
        font-size:22px;
    }

    .hero-subtitle{
        font-size:11px;
        margin-top:6px;
    }


    /* SECTIONS */
    .section{
        margin-top:24px;
    }

    .section-title{
        font-size:18px;
        margin-bottom:14px;
    }

    .section-title::after{
        width:50px;
        margin-top:6px;
    }


    /* MY MATCHES */
    .match-grid{
        gap:8px;
    }

    .match-card{
        min-height:125px;
        border-radius:16px;
    }

    .match-icon{
        width:50px;
        height:50px;
        border-radius:14px;
        font-size:27px;
        margin-bottom:8px;
    }

    .match-name{
        font-size:11px;
    }

    .match-count{
        font-size:10px;
        margin-top:4px;
    }


    /* TABS */
    .tabs{
        height:48px;
        border-radius:13px;
    }

    .tab{
        font-size:11px;
    }


    /* GAME GRID */
    .game-grid{
        margin-top:14px;
        gap:9px;
    }

    .game-card{
        height:205px;
        border-radius:16px;
    }

    .game-info{
        left:9px;
        right:9px;
        bottom:8px;
    }

    .game-title{
        font-size:10px;
        margin-bottom:6px;
    }

    .join-btn{
        height:31px;
        border-radius:9px;
        font-size:10px;
    }


    /* BOTTOM NAV */
    .bottom-nav{
        height:72px;
    }

    .nav-icon{
        font-size:21px;
        margin-bottom:3px;
    }

    .nav-item{
        font-size:10px;
    }
}
/* ===== PREMIUM BOTTOM NAVIGATION ===== */

.bottom-nav {
    position: fixed;
    left: 18px;
    right: 18px;
    bottom: 18px;

    height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-around;

    background: rgba(18, 18, 22, 0.88);

    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 24px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.75),
        0 0 25px rgba(255,255,255,0.06);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    z-index: 99999;

    padding: 0 8px;
}


/* NAV BUTTON */

.nav-item {
    position: relative;

    width: 64px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent !important;
    border: none !important;

    color: rgba(255,255,255,0.38);

    border-radius: 18px;

    transition:
        transform 0.25s ease,
        color 0.25s ease,
        background 0.25s ease;
}


/* ICON */

.nav-icon {
    font-size: 30px;

    color: rgba(255,255,255,0.38);

    transition:
        transform 0.25s ease,
        color 0.25s ease,
        text-shadow 0.25s ease;
}


/* ACTIVE PAGE */

.nav-item.active {
    background: rgba(255,255,255,0.09) !important;

    box-shadow:
        inset 0 0 15px rgba(255,255,255,0.04);
}


/* ACTIVE ICON PREMIUM GLOW */

.nav-item.active .nav-icon {
    color: #ffffff;

    transform: scale(1.12);

    text-shadow:
        0 0 5px rgba(255,255,255,0.95),
        0 0 12px rgba(255,255,255,0.75),
        0 0 24px rgba(255,255,255,0.35);
}


/* ACTIVE SMALL GLOW DOT */

.nav-item.active::after {
    content: "";

    position: absolute;

    bottom: 5px;
    left: 50%;

    width: 5px;
    height: 5px;

    transform: translateX(-50%);

    background: #ffffff;

    border-radius: 50%;

    box-shadow:
        0 0 6px #ffffff,
        0 0 12px rgba(255,255,255,0.8);
}


/* TOUCH EFFECT */

.nav-item:active {
    transform: scale(0.88);
}


/* PAGE SPACE */

body {
    padding-bottom: 110px;
}
    /* =====================================================
   FINAL SCREEN FIT - NO SCROLL
   TARGET: 2 x 2 GAME CARDS + BOTTOM NAV
===================================================== */

    .games-grid,

    /* ================= TABS ================= */

    .game-tabs,

    .category-tabs{

    /* ================= GAME CARDS ================= */

    .game-card,

    /* GAME IMAGE */

    .game-card-content,

    /* GAME NAME */

    .game-title,

    .game-card button,

        width:100% !important;

    /* ================= BOTTOM NAV ================= */

    .bottom-nav{

        position:fixed !important;

        left:20px !important;

    }

    .bottom-nav .nav-item{

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="top-header">

    <div class="header-avatar">
        <img src="eren.jpg" alt="Eren">
    </div>

    <div class="welcome">

        <div class="welcome-small">
            Welcome Back.
        </div>

        <div class="welcome-name">
            EREN YEAGER
        </div>

    </div>

    <div class="header-wallet">

        <div class="coin">₹</div>

        <div class="balance">
            0.00
        </div>

    </div>

</header>


<main class="main">

<!-- ================= PAVI GAME ================= -->

<section class="hero">

    <div class="hero-content">

        <div class="hero-title">
            ⚡ PAVI GAME 🎯
        </div>

        <div class="hero-subtitle">
            Play • Compete • Win
        </div>

    </div>

</section>


<!-- ================= MY MATCHES ================= -->

<section class="section">

    <h2 class="section-title">
        My Matches
    </h2>

    <div class="match-grid">

        <div class="match-card">

            <div class="match-icon">
                ↻
            </div>

            <div class="match-name">
                Ongoing
            </div>

            <div class="match-count">
                0
            </div>

        </div>


        <div class="match-card">

            <div class="match-icon">
                □
            </div>

            <div class="match-name">
                Upcoming
            </div>

            <div class="match-count">
                0
            </div>

        </div>


        <div class="match-card">

            <div class="match-icon">
                ✓
            </div>

            <div class="match-name">
                Completed
            </div>

            <div class="match-count">
                0
            </div>

        </div>

    </div>

</section>


<!-- ================= ESPORTS ================= -->

<section class="section">

    <h2 class="section-title">
        Esports Games
    </h2>


    <div class="tabs">

        <button class="tab active">
            TOURNAMENT
        </button>

        <button class="tab">
            SOLO
        </button>

    </div>


    <div class="game-grid">


        <!-- FULL MAP -->

        <div class="game-card">

            <img
                class="game-image"
                src="eren.jpg"
                alt="FULL MAP">

            <div class="game-info">

                <div class="game-title">
                    FULL MAP
                </div>

                <button
                    class="join-btn"
                    onclick="joinGame('FULL MAP')">
                    JOIN
                </button>

            </div>

        </div>


        <!-- CS 1V1 -->

        <div class="game-card">

            <img
                class="game-image"
                src="eren.jpg"
                alt="CS 1V1 ONETAP">

            <div class="game-info">

                <div class="game-title">
                    CS 1V1 ONETAP
                </div>

                <button
                    class="join-btn"
                    onclick="joinGame('CS 1V1 ONETAP')">
                    JOIN
                </button>

            </div>

        </div>


        <!-- CS 2V2 -->

        <div class="game-card">

            <img
                class="game-image"
                src="eren.jpg"
                alt="CS 2V2 ONETAP">

            <div class="game-info">

                <div class="game-title">
                    CS 2V2 ONETAP
                </div>

                <button
                    class="join-btn"
                    onclick="joinGame('CS 2V2 ONETAP')">
                    JOIN
                </button>

            </div>

        </div>


        <!-- CS 4V4 -->

        <div class="game-card">

            <img
                class="game-image"
                src="eren.jpg"
                alt="CS 4V4 ONETAP">

            <div class="game-info">

                <div class="game-title">
                    CS 4V4 ONETAP
                </div>

                <button
                    class="join-btn"
                    onclick="joinGame('CS 4V4 ONETAP')">
                    JOIN
                </button>

            </div>

        </div>


    </div>

</section>

</main>
<nav class="bottom-nav">

    <button class="nav-item" data-page="home" onclick="goHome()">
        <span class="nav-icon">⌂</span>
    </button>

    <button class="nav-item" data-page="wallet" onclick="goWallet()">
        <span class="nav-icon">▣</span>
    </button>

    <button class="nav-item" data-page="profile" onclick="goProfile()">
        <span class="nav-icon">♟</span>
    </button>

</nav>
    
<script>
    function goHome() {
    window.location.href = "index.html";
}

function goWallet() {
    window.location.href = "wallet.html";
}

function goProfile() {
    window.location.href = "profile.html";
}

document.addEventListener("DOMContentLoaded", function () {

    const path = window.location.pathname.toLowerCase();

    let currentPage = "home";

    if (path.includes("wallet")) {
        currentPage = "wallet";
    } 
    else if (path.includes("profile")) {
        currentPage = "profile";
    }

    document.querySelectorAll(".nav-item").forEach(function (item) {

        if (item.dataset.page === currentPage) {
            item.classList.add("active");
        } else {
            item.classList.remove("active");
        }

    });

});
