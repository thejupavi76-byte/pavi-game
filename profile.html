<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>My Profile</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

    width:100%;
    min-height:100%;

    background:#000 !important;

    color:#fff;

    overflow-x:hidden;
}

body{

    font-family:
        'Chakra Petch',
        Arial,
        sans-serif;

    padding:0 !important;
}


/* =====================================================
   PROFILE PAGE
===================================================== */

#profilePage{

    width:100%;

    min-height:100vh;

    background:#000;

    color:#fff;

    padding:
        20px
        16px
        115px;

    overflow:hidden;
}

.profile-wrap{

    width:100%;

    max-width:700px;

    margin:0 auto;
}


/* =====================================================
   HEADER
===================================================== */

.profile-header{

    display:flex;

    align-items:center;

    gap:14px;

    margin-bottom:25px;
}


/* BACK BUTTON */

.profile-back{

    width:48px;

    height:48px;

    border-radius:15px;

    border:1px solid
        rgba(255,255,255,.22);

    background:#080808;

    color:#fff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

    cursor:pointer;

    box-shadow:
        0 0 8px
        rgba(255,255,255,.12);

    transition:.2s ease;
}

.profile-back:active{

    transform:scale(.92);

    background:#111;
}


/* TITLE */

.profile-title{

    font-size:27px;

    font-weight:700;

    color:#fff;

    letter-spacing:.4px;

    text-shadow:
        0 0 5px
        rgba(255,255,255,.4);
}


/* =====================================================
   PROFILE CARD
===================================================== */

.profile-card{

    width:100%;

    background:
        linear-gradient(
            145deg,
            #111 0%,
            #070707 48%,
            #020202 100%
        );

    border:1px solid
        rgba(255,255,255,.55);

    border-radius:25px;

    padding:26px 22px 23px;

    box-shadow:
        0 0 9px
        rgba(255,255,255,.12),

        inset 0 0 25px
        rgba(255,255,255,.025);
}


/* PROFILE TOP */

.profile-user{

    display:flex;

    align-items:center;

    gap:20px;
}


/* AVATAR */

.profile-avatar{

    width:105px;

    height:105px;

    flex-shrink:0;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            #292929,
            #080808
        );

    border:1px solid
        rgba(255,255,255,.7);

    display:flex;

    align-items:center;

    justify-content:center;

    color:#fff;

    font-size:48px;

    font-weight:700;

    box-shadow:
        0 0 10px
        rgba(255,255,255,.14),

        inset 0 0 18px
        rgba(255,255,255,.04);
}


/* USER DETAILS */

.profile-info{

    min-width:0;
}

.profile-label{

    color:#888;

    font-size:12px;

    letter-spacing:1.5px;

    margin-bottom:6px;
}

.profile-name{

    color:#fff;

    font-size:25px;

    font-weight:700;

    margin-bottom:7px;

    text-shadow:
        0 0 5px
        rgba(255,255,255,.35);

    word-break:break-word;
}

.profile-email{

    color:#777;

    font-size:12px;

    word-break:break-word;
}


/* CARD LINE */

.profile-divider{

    width:100%;

    height:1px;

    background:
        rgba(255,255,255,.16);

    margin:25px 0;
}


/* WALLET BALANCE */

.profile-balance-label{

    color:#888;

    font-size:12px;

    letter-spacing:1.5px;

    margin-bottom:8px;
}

.profile-balance{

    color:#fff;

    font-size:35px;

    font-weight:700;

    text-shadow:
        0 0 6px
        rgba(255,255,255,.45);
}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{

    color:#fff;

    font-size:22px;

    font-weight:700;

    margin:

        31px
        0
        15px;

    text-shadow:
        0 0 5px
        rgba(255,255,255,.3);
}


/* =====================================================
   STATISTICS
===================================================== */

.profile-stats{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:11px;
}


.profile-stat{

    min-height:125px;

    background:#070707;

    border:1px solid
        rgba(255,255,255,.40);

    border-radius:20px;

    padding:15px 10px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    box-shadow:
        0 0 7px
        rgba(255,255,255,.07);
}


/* STAT ICON */

.stat-icon{

    font-size:26px;

    color:#aaa;

    margin-bottom:8px;

    text-shadow:
        0 0 5px
        rgba(255,255,255,.25);
}


/* STAT NUMBER */

.stat-number{

    color:#fff;

    font-size:24px;

    font-weight:700;

    margin-bottom:7px;

    text-shadow:
        0 0 5px
        rgba(255,255,255,.35);
}


/* STAT LABEL */

.stat-name{

    color:#777;

    font-size:11px;

    letter-spacing:.5px;
}


/* =====================================================
   ACCOUNT BOX
===================================================== */

.account-box{

    width:100%;

    background:#070707;

    border:1px solid
        rgba(255,255,255,.38);

    border-radius:21px;

    overflow:hidden;

    box-shadow:
        0 0 8px
        rgba(255,255,255,.06);
}


/* ACCOUNT ITEM */

.account-item{

    width:100%;

    min-height:88px;

    padding:
        14px
        20px;

    display:flex;

    align-items:center;

    gap:17px;

    background:transparent;

    border:0;

    color:#fff;

    font-family:inherit;

    cursor:pointer;

    text-align:left;

    position:relative;

    transition:.2s ease;
}


/* DIVIDER */

.account-item:not(:last-child)::after{

    content:"";

    position:absolute;

    left:20px;

    right:20px;

    bottom:0;

    height:1px;

    background:
        rgba(255,255,255,.10);
}


/* ITEM ICON */

.account-icon{

    width:48px;

    height:48px;

    flex-shrink:0;

    border-radius:15px;

    background:#111;

    border:1px solid
        rgba(255,255,255,.18);

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

    color:#aaa;

    box-shadow:
        0 0 7px
        rgba(255,255,255,.05);
}


/* ITEM TEXT */

.account-text{

    flex:1;

    font-size:15px;

    font-weight:700;

    color:#ddd;
}


/* ARROW */

.account-arrow{

    font-size:28px;

    color:#555;

    transition:.2s ease;
}


/* TOUCH */

.account-item:active{

    background:#111;

    transform:scale(.985);
}

.account-item:active
.account-arrow{

    color:#fff;

    transform:translateX(3px);
}


/* =====================================================
   LOGOUT
===================================================== */

.account-item.logout
.account-icon{

    color:#aaa;

    border-color:
        rgba(255,255,255,.18);
}

.account-item.logout
.account-text{

    color:#aaa;
}


/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.bottom-nav{

    position:fixed;

    left:14px;

    right:14px;

    bottom:14px;

    height:68px;

    display:flex;

    align-items:center;

    justify-content:space-around;

    background:
        rgba(12,12,14,.97);

    border:1px solid
        rgba(255,255,255,.15);

    border-radius:23px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.9);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    z-index:99999;
}


/* NAV ITEM */

.bottom-nav .nav-item{

    position:relative;

    width:70px;

    height:58px;

    border:0 !important;

    outline:none;

    background:
        transparent !important;

    color:#555;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;

    cursor:pointer;

    transition:.2s ease;
}


/* NAV ICON */

.bottom-nav .nav-icon{

    font-size:27px;

    color:#555;

    transition:.2s ease;
}


/* ACTIVE */

.bottom-nav
.nav-item.active
.nav-icon{

    color:#fff;

    text-shadow:
        0 0 5px
        rgba(255,255,255,.7),

        0 0 12px
        rgba(255,255,255,.28);

    transform:
        scale(1.06);
}


/* ACTIVE DOT */

.bottom-nav
.nav-item.active::after{

    content:"";

    position:absolute;

    bottom:2px;

    left:50%;

    width:5px;

    height:5px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 5px
        rgba(255,255,255,.6);
}


/* TOUCH */

.bottom-nav
.nav-item:active{

    transform:scale(.90);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

    #profilePage{

        padding:
            18px
            15px
            110px;
    }


    .profile-title{

        font-size:25px;
    }


    .profile-back{

        width:46px;

        height:46px;

        font-size:28px;
    }


    .profile-card{

        padding:
            22px
            17px
            21px;

        border-radius:23px;
    }


    .profile-user{

        gap:15px;
    }


    .profile-avatar{

        width:90px;

        height:90px;

        border-radius:25px;

        font-size:42px;
    }


    .profile-name{

        font-size:22px;
    }


    .profile-email{

        font-size:11px;
    }


    .profile-balance{

        font-size:32px;
    }


    .section-title{

        font-size:21px;

        margin-top:28px;
    }


    .profile-stats{

        gap:8px;
    }


    .profile-stat{

        min-height:112px;

        padding:
            12px
            7px;
    }


    .stat-icon{

        font-size:23px;
    }


    .stat-number{

        font-size:21px;
    }


    .stat-name{

        font-size:10px;
    }


    .account-item{

        min-height:82px;

        padding:
            12px
            16px;
    }


    .account-icon{

        width:44px;

        height:44px;

        border-radius:14px;
    }


    .account-text{

        font-size:14px;
    }


    .account-arrow{

        font-size:25px;
    }

}

</style>

</head>


<body>

<!-- =====================================================

===================================================== -->
